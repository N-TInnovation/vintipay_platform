spring:
  profiles:
    active: ${ENVIRONMENT:local}
  cache:
    cache-names: channels
    caffeine:
      spec: expireAfterWrite=1m
  main:
    allow-circular-references: true
  application:
    name: gateway-pagamento
  cloud:
    openfeign:
      client:
        config:
          default:
            loggerLevel: full
  datasource:
    url: jdbc:mysql://localhost:3306/vintipay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false
        web-admin-password: admin

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.jdbc.datasource.init: DEBUG
    cv.ntinnovation.vintipay: DEBUG
    org.springframework.security: DEBUG

# Configurações da aplicação
app:
  base-url: ${APP_BASE_URL:https://localhost:8443}
  stripe:
    success-url: ${app.base-url}/assinaturas/sucesso
    cancel-url: ${app.base-url}/assinaturas/cancelado
