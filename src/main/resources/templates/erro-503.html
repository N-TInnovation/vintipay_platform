<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Serviço indisponível'">Serviço indisponível</title>
    
    <!-- Incluir fragmento de favicon reutilizável -->
    <th:block th:replace="fragments/head-favicons :: favicons"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        .error-icon {
            font-size: 5rem;
            color: #ffc107;
            margin-bottom: 1rem;
            animation: spin 4s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-code {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffc107;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-size: 1.5rem;
            color: #495057;
            margin-bottom: 1rem;
        }
        .error-message {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 2rem;
        }
        .error-details {
            font-size: 1rem;
            color: #6c757d;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .btn-voltar {
            padding: 0.5rem 1.5rem;
            font-size: 1.1rem;
        }
        .btn-voltar i {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <i class="fas fa-cog error-icon"></i>
        <div class="error-code">503</div>
        <div class="error-title" th:text="${title} ?: 'Serviço indisponível'">Serviço indisponível</div>
        <div class="error-message" th:if="${message}" th:text="${message}">
            O serviço está temporariamente indisponível.
        </div>
        <div class="error-details" th:if="${details}" th:text="${details}">
            Por favor, tente novamente em alguns instantes.
        </div>
        <a href="javascript:history.back()" class="btn btn-warning btn-voltar">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>
</body>
</html>
