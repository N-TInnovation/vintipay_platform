<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento vinti4</title>
    
    <!-- Incluir fragmento de favicon reutilizável -->
    <th:block th:replace="fragments/head-favicons :: favicons"></th:block>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <style>
        .container {
            text-align: center;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Arial, sans-serif;
        }
        .status-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .status-text {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        .message {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .warning { color: #ffc107; }
        .loading { color: #007bff; }
        .receipt-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .receipt-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body onload="autoPost()">
    <div class="container">
        <!-- Status em processamento -->
        <div th:if="${response.status == 'PENDENTE'}" class="animate__animated animate__pulse animate__infinite">
            <i class="status-icon loading fas fa-circle-notch fa-spin"></i>
            <div class="status-text">Processando pagamento...</div>
            <div class="message" th:text="${response.message}">Aguarde enquanto processamos seu pagamento</div>
        </div>
        
        <!-- Status de sucesso -->
        <div th:if="${response.status == 'SUCESSO'}" class="animate__animated animate__bounceIn">
            <i class="status-icon success fas fa-check-circle"></i>
            <div class="status-text">Pagamento realizado com sucesso!</div>
            <div class="message" th:text="${response.message}">Transação aprovada</div>
            <a th:href="@{/pagamento/recibo/{reference}(reference=${response.reference}, sessionId=${#httpServletRequest.cookies['PAYMENT_SESSION_ID']?.value})}" class="receipt-link">
                <i class="fas fa-receipt"></i> Ver Recibo
            </a>
        </div>
        
        <!-- Status de cancelamento -->
        <div th:if="${response.status == 'CANCELADO'}" class="animate__animated animate__bounceIn">
            <i class="status-icon warning fas fa-times-circle"></i>
            <div class="status-text">Pagamento cancelado</div>
            <div class="message" th:text="${response.message}">Operação cancelada pelo usuário</div>
        </div>
        
        <!-- Status de erro -->
        <div th:if="${response.status == 'FALHA'}" class="animate__animated animate__bounceIn">
            <i class="status-icon error fas fa-exclamation-circle"></i>
            <div class="status-text">Erro no pagamento</div>
            <div class="message" th:text="${response.message}">Não foi possível processar o pagamento</div>
        </div>
    </div>
    
    <form th:action="@{${submitFormUrl}}" th:object="${response}" method="post">
        <input type="hidden" th:value="*{reference}" name="reference">
        <input type="hidden" th:value="*{status}" name="status">
        <input type="hidden" th:value="*{message}" name="message">
        <input type="hidden" th:value="*{amount}" name="amount">
        <input type="hidden" th:value="*{currency}" name="currency">
        <input type="hidden" th:value="*{merchantSession}" name="merchantSession">
        <input type="hidden" th:value="*{merchantRef}" name="merchantRef">
        <input type="hidden" th:value="*{timestamp}" name="timestamp">
        <input type="hidden" th:value="*{panMascarado}" name="panMascarado">
        <!-- Campo de fingerprint HMAC para verificação de integridade -->
        <input type="hidden" th:value="${hmacFingerprint}" name="fingerprint">
    </form>
    
    <script>
        function autoPost() {
            // Aguarda 2 segundos antes de submeter o formulário
            setTimeout(function() {
                document.forms[0].submit();
            }, 2000);
        }
    </script>
</body>
</html>
