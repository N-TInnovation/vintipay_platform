<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Incluir fragmento de favicon reutilizável -->
    <th:block th:replace="~{fragments/head-favicons :: favicons}"></th:block>
    
    <title>Erro de Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .error-container {
            max-width: 90%;
            width: 550px;
            text-align: center;
            padding: 2rem;
        }
        .error-card {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 3rem 2rem;
            position: relative;
            overflow: hidden;
        }
        .error-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(135deg, #e63946 0%, #9d4edd 100%);
        }
        .error-icon {
            margin-bottom: 1.5rem;
            font-size: 3.5rem;
            width: 90px;
            height: 90px;
            line-height: 90px;
            text-align: center;
            border-radius: 50%;
            background: rgba(230, 57, 70, 0.1);
            color: #e63946;
            display: inline-block;
        }
        .error-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #4361ee;
            background: linear-gradient(to right, #e63946, #9d4edd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-message {
            font-size: 18px;
            color: #4a5568;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn-return {
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }
        .btn-return:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <div class="error-code" th:text="${'Erro ' + errorCode}">Erro 401</div>
            <h1 class="error-title" th:text="${errorTitle}">Sessão Expirada</h1>
            <p class="error-message" th:text="${errorMessage}">Sua sessão de pagamento expirou. Por favor, inicie o processo de pagamento novamente.</p>
            <a href="javascript:history.back()" class="btn-return">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>
    </div>
</body>
</html>
