<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - VintiPay</title>
    
    <!-- Incluir fragmento de favicon reutilizável -->
    <th:block th:replace="fragments/head-favicons :: favicons"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            position: relative;
            border-bottom: none;
        }
        .card-header::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 0;
            right: 0;
            height: 30px;
            background: white;
            border-radius: 50% 50% 0 0;
            z-index: 2;
        }
        .btn-primary {
            background: #0d6efd;
            border-color: #0d6efd;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .btn-primary:hover {
            background: #0b5ed7;
            border-color: #0b5ed7;
        }
        .alert {
            border-radius: 8px;
            font-weight: 500;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #4361ee;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #4a5568;
        }
        .card-footer {
            background-color: white;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
            padding: 1.2rem;
        }
        .card-footer a {
            color: #4361ee;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .card-footer a:hover {
            color: #3a0ca3;
            text-decoration: underline;
        }
        .brand-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .brand-logo img {
            max-height: 48px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="card-header">
                <img src="/img/logo.png" alt="Logo" class="logo" onerror="this.onerror=null; this.src='/img/payment-icon.png';">
                <h4 class="mb-0">Gateway de Pagamento</h4>
                <p class="mb-0">Painel Administrativo</p>
            </div>
            <div class="card-body p-4">
                <div th:if="${param.error}" class="alert alert-danger mb-4" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i> Credenciais inválidas. Por favor, tente novamente.
                </div>
                <div th:if="${param.logout}" class="alert alert-success mb-4" role="alert">
                    <i class="fas fa-check-circle me-2"></i> Você foi desconectado com sucesso.
                </div>
                
                <form th:action="@{/login}" method="post">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Nome de usuário" required autofocus>
                        <label for="username">Nome de usuário</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Senha" required>
                        <label for="password">Senha</label>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="remember-me" id="remember-me" name="remember-me">
                            <label class="form-check-label" for="remember-me">
                                Lembrar de mim
                            </label>
                        </div>
                        <div>
                            <a th:href="@{/recuperar-senha}" class="text-primary">Esqueceu sua senha?</a>
                        </div>
                    </div>
                    <button class="w-100 btn btn-lg btn-primary" type="submit">
                        <i class="fas fa-sign-in-alt me-2"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
        <div class="text-center mt-4 text-muted">
            <small>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> Gateway de Pagamento. Todos os direitos reservados.</small>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
