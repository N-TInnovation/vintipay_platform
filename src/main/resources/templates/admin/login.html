<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gateway de Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 15px;
            margin: auto;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .card-header {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
        }
        .logo {
            max-width: 80px;
            margin-bottom: 1rem;
        }
        .form-floating:focus-within {
            z-index: 2;
        }
        .btn-primary {
            background-color: #343a40;
            border-color: #343a40;
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: #23272b;
            border-color: #23272b;
        }
        .alert {
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="card-header">
                <img src="/img/logo.png" alt="Logo" class="logo" onerror="this.onerror=null; this.src='/img/payment-icon.png';">
                <h4 class="mb-0">Gateway de Pagamento</h4>
                <p class="mb-0">Painel Administrativo</p>
            </div>
            <div class="card-body p-4">
                <div th:if="${param.error}" class="alert alert-danger mb-4" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i> Credenciais inválidas. Por favor, tente novamente.
                </div>
                <div th:if="${param.logout}" class="alert alert-success mb-4" role="alert">
                    <i class="fas fa-check-circle me-2"></i> Você foi desconectado com sucesso.
                </div>
                
                <form th:action="@{/login}" method="post">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Nome de usuário" required autofocus>
                        <label for="username">Nome de usuário</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Senha" required>
                        <label for="password">Senha</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" value="remember-me" id="remember-me" name="remember-me">
                        <label class="form-check-label" for="remember-me">
                            Lembrar de mim
                        </label>
                    </div>
                    <button class="w-100 btn btn-lg btn-primary" type="submit">
                        <i class="fas fa-sign-in-alt me-2"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
        <div class="text-center mt-4 text-muted">
            <small>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> Gateway de Pagamento. Todos os direitos reservados.</small>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
