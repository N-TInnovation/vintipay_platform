<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt"
      th:replace="~{admin/layout/base :: html(
        title='Gerenciamento de Permissões',
        activeMenu='permissoes',
        pageTitle='Gerenciamento de Permissões',
        content=~{::content},
        additionalCss=~{::additionalCss},
        additionalJs=~{::additionalJs}
      )}">
<head>
    <additionalCss>
        <style>
            .card-header .btn {
                margin-left: 10px;
            }
            .table-actions {
                white-space: nowrap;
            }
            .table-actions .btn {
                margin-right: 5px;
            }
        </style>
    </additionalCss>
</head>
<body>
    <content>
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Lista de Permissões</h5>
                <a th:href="@{/admin/permissoes/nova}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Nova Permissão
                </a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>Data de Criação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${permissoes.empty}">
                                <td colspan="6" class="text-center">Nenhuma permissão cadastrada</td>
                            </tr>
                            <tr th:each="permissao : ${permissoes}">
                                <td th:text="${permissao.id}"></td>
                                <td th:text="${permissao.nome}"></td>
                                <td th:text="${permissao.codigo}"></td>
                                <td th:text="${permissao.descricao}"></td>
                                <td th:text="${#temporals.format(permissao.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="table-actions">
                                    <a th:href="@{/admin/permissoes/{id}(id=${permissao.id})}" class="btn btn-sm btn-info">
                                        <i class="fas fa-edit"></i> Editar
                                    </a>
                                    <button class="btn btn-sm btn-danger" 
                                            th:onclick="'excluirPermissao(' + ${permissao.id} + ')'">
                                        <i class="fas fa-trash"></i> Excluir
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </content>
    
    <additionalJs>
        <script>
            function excluirPermissao(id) {
                if (confirm('Tem certeza que deseja excluir esta permissão?')) {
                    fetch(`/admin/permissoes/${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert(data.message);
                            window.location.reload();
                        } else {
                            alert(data.message || 'Erro ao excluir permissão');
                        }
                    })
                    .catch(error => {
                        console.error('Erro:', error);
                        alert('Erro ao excluir permissão');
                    });
                }
            }
        </script>
    </additionalJs>
</body>
</html>
