<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt"
      th:replace="~{admin/layout/base :: html(
        title='Configurações',
        activeMenu='configuracoes',
        pageTitle='Gerenciamento de Configurações',
        content=~{::content},
        additionalCss=~{::additionalCss},
        additionalJs=~{::additionalJs}
      )}">
<head>
    <additionalCss>
        <style>
            .table-actions {
                width: 180px;
            }
            .status-badge {
                width: 80px;
            }
        </style>
    </additionalCss>
</head>
<body>
    <content>
        <!-- Botão de adicionar configuração -->
        <div class="d-flex justify-content-end mb-4">
            <a th:href="@{/admin/configuracoes/nova}" class="btn btn-primary">
                <i class="fas fa-plus me-2"></i> Nova Configuração
            </a>
        </div>
        
        <!-- Alerts -->
        <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i> <span th:text="${mensagem}">Operação realizada com sucesso!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${erro}">Ocorreu um erro!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Tabela de Configurações -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(configuracoes)}" class="text-center py-5">
                    <i class="fas fa-cogs fa-3x text-muted mb-3"></i>
                    <h5>Nenhuma configuração encontrada</h5>
                    <p class="text-muted">Não há configurações de pagamento cadastradas no sistema.</p>
                </div>
                
                <div th:if="${not #lists.isEmpty(configuracoes)}" class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome da Loja</th>
                                <th>Merchant ID</th>
                                <th>Usuário</th>
                                <th>Status</th>
                                <th class="table-actions">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="config : ${configuracoes}">
                                <td th:text="${config.id}">1</td>
                                <td th:text="${config.nomeLoja}">Loja Exemplo</td>
                                <td th:text="${config.merchantId}">MERCH123</td>
                                <td>
                                    <a th:if="${config.usuario != null}" th:href="@{/admin/usuarios/{id}(id=${config.usuario.id})}" th:text="${config.usuario.username}">usuario@exemplo.com</a>
                                    <span th:unless="${config.usuario != null}">-</span>
                                </td>
                                <td>
                                    <span th:if="${config.ativo}" class="badge bg-success status-badge">Ativo</span>
                                    <span th:unless="${config.ativo}" class="badge bg-danger status-badge">Inativo</span>
                                </td>
                                <td>
                                    <div class="btn-group">
                                        <a th:href="@{/admin/configuracoes/{id}(id=${config.id})}" class="btn btn-sm btn-outline-primary" title="Detalhes" data-bs-toggle="tooltip">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/admin/configuracoes/{id}/editar(id=${config.id})}" class="btn btn-sm btn-outline-secondary" title="Editar" data-bs-toggle="tooltip">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <button th:if="${config.ativo}" class="btn btn-sm btn-outline-danger" title="Desativar" data-bs-toggle="tooltip" 
                                                th:onclick="'alterarStatus(' + ${config.id} + ', false)'">
                                            <i class="fas fa-ban"></i>
                                        </button>
                                        <button th:unless="${config.ativo}" class="btn btn-sm btn-outline-success" title="Ativar" data-bs-toggle="tooltip" 
                                                th:onclick="'alterarStatus(' + ${config.id} + ', true)'">
                                            <i class="fas fa-check"></i>
                                        </button>
                                        <a th:href="@{/admin/configuracoes/{id}/testar(id=${config.id})}" class="btn btn-sm btn-outline-info" title="Testar Conexão" data-bs-toggle="tooltip">
                                            <i class="fas fa-plug"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </content>
    
    <additionalJs>
        <script>
            function alterarStatus(id, ativo) {
                const acao = ativo ? 'ativar' : 'desativar';
                const mensagem = ativo ? 'Tem certeza que deseja ativar esta configuração?' : 'Tem certeza que deseja desativar esta configuração?';
                
                if (confirm(mensagem)) {
                    fetch(`/admin/configuracoes/${id}/${acao}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]').getAttribute('content')
                        }
                    })
                    .then(response => {
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            throw new Error('Erro ao alterar status');
                        }
                    })
                    .catch(error => {
                        alert('Ocorreu um erro ao alterar o status da configuração: ' + error.message);
                    });
                }
            }
        </script>
    </additionalJs>
</body>
</html>
