<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração de Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title mb-0" th:text="${configuracao.id != null ? 'Editar Configuração' : 'Nova Configuração'}"></h3>
                    </div>
                    <div class="card-body">
                        <form id="configForm" class="needs-validation" novalidate>
                            <input type="hidden" id="id" th:value="${configuracao.id}">
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="posId" class="form-label">POS ID *</label>
                                    <input type="text" class="form-control" id="posId" th:value="${configuracao.posId}" required>
                                    <div class="invalid-feedback">
                                        POS ID é obrigatório
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="merchantId" class="form-label">Merchant ID *</label>
                                    <input type="text" class="form-control" id="merchantId" th:value="${configuracao.merchantId}" required>
                                    <div class="invalid-feedback">
                                        Merchant ID é obrigatório
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="terminalId" class="form-label">Terminal ID *</label>
                                    <input type="text" class="form-control" id="terminalId" th:value="${configuracao.terminalId}" required>
                                    <div class="invalid-feedback">
                                        Terminal ID é obrigatório
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="posAutCode" class="form-label">POS Aut Code *</label>
                                    <input type="text" class="form-control" id="posAutCode" th:value="${configuracao.posAutCode}" required>
                                    <div class="invalid-feedback">
                                        POS Aut Code é obrigatório
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="isActive" th:checked="${configuracao.isActive}">
                                    <label class="form-check-label" for="isActive">Ativo</label>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Salvar
                                </button>
                                <a href="/admin/configuracoes" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Voltar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!this.checkValidity()) {
                e.stopPropagation();
                this.classList.add('was-validated');
                return;
            }

            const data = {
                id: document.getElementById('id').value || null,
                posId: document.getElementById('posId').value,
                merchantId: document.getElementById('merchantId').value,
                terminalId: document.getElementById('terminalId').value,
                posAutCode: document.getElementById('posAutCode').value,
                isActive: document.getElementById('isActive').checked
            };

            Swal.fire({
                title: 'Salvando...',
                text: 'Por favor, aguarde',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            fetch('/admin/configuracoes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(response => {
                if (!response.ok) {
                    return response.json().then(err => Promise.reject(err));
                }
                return response.json();
            }).then(result => {
                if (result.success) {
                    let html = '<div class="text-center">';
                    html += '<h5 class="mb-4">' + result.message + '</h5>';
                    
                    if (result.apiKey && result.apiSecret) {
                        html += '<div class="alert alert-warning" role="alert">';
                        html += '<p class="mb-2"><strong>Guarde estas informações em um local seguro!</strong></p>';
                        html += '<p class="mb-2">Elas não serão mostradas novamente.</p>';
                        html += '</div>';
                        
                        html += '<div class="mb-3">';
                        html += '<p class="mb-2"><strong>API Key:</strong></p>';
                        html += '<div class="input-group mb-3">';
                        html += '<input type="text" class="form-control" value="' + result.apiKey + '" readonly>';
                        html += '<button class="btn btn-outline-secondary" type="button" onclick="copyToClipboard(this)">Copiar</button>';
                        html += '</div>';
                        html += '</div>';
                        
                        html += '<div class="mb-3">';
                        html += '<p class="mb-2"><strong>API Secret:</strong></p>';
                        html += '<div class="input-group mb-3">';
                        html += '<input type="text" class="form-control" value="' + result.apiSecret + '" readonly>';
                        html += '<button class="btn btn-outline-secondary" type="button" onclick="copyToClipboard(this)">Copiar</button>';
                        html += '</div>';
                        html += '</div>';
                    }
                    
                    html += '</div>';
                    
                    Swal.fire({
                        title: 'Sucesso!',
                        html: html,
                        icon: 'success',
                        width: '600px',
                        showConfirmButton: true,
                        confirmButtonText: 'Continuar'
                    }).then(() => {
                        window.location.href = '/admin/configuracoes';
                    });
                } else {
                    throw new Error(result.message || 'Erro ao salvar configuração');
                }
            }).catch(error => {
                Swal.fire({
                    title: 'Erro!',
                    text: error.message || 'Erro ao salvar configuração',
                    icon: 'error'
                });
            });
        });

        function copyToClipboard(button) {
            const input = button.parentElement.querySelector('input');
            input.select();
            document.execCommand('copy');
            
            const originalText = button.textContent;
            button.textContent = 'Copiado!';
            button.classList.remove('btn-outline-secondary');
            button.classList.add('btn-success');
            
            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('btn-success');
                button.classList.add('btn-outline-secondary');
            }, 2000);
        }
    </script>
</body>
</html>
