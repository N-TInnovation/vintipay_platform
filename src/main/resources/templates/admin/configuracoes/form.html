<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração de Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Gateway de Pagamento</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/pagamentos">Pagamentos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/configuracoes">Configurações</a>
                    </li>
                </ul>
                <form th:action="@{/logout}" method="post" class="d-flex">
                    <button class="btn btn-outline-light" type="submit">Sair</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="card-title mb-0" th:text="${configuracao.id != null ? 'Editar Configuração' : 'Nova Configuração'}"></h3>
                        <div>
                            <a href="/admin" class="btn btn-outline-secondary btn-sm me-2">
                                <i class="fas fa-home"></i> Dashboard
                            </a>
                            <a href="/admin/configuracoes" class="btn btn-outline-primary btn-sm">
                                <i class="fas fa-list"></i> Lista de Configurações
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <form id="configForm" class="needs-validation" novalidate>
                            <input type="hidden" id="id" th:value="${configuracao.id}">
                            <input type="hidden" id="returnAutCode" th:value="${configuracao.returnAutCode}">
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="posId" class="form-label">POS ID *</label>
                                    <input type="text" class="form-control" id="posId" th:value="${configuracao.posId}" required>
                                    <div class="invalid-feedback">
                                        POS ID é obrigatório
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="merchantId" class="form-label">Merchant ID *</label>
                                    <input type="text" class="form-control" id="merchantId" th:value="${configuracao.merchantId}" required>
                                    <div class="invalid-feedback">
                                        Merchant ID é obrigatório
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="terminalId" class="form-label">Terminal ID *</label>
                                    <input type="text" class="form-control" id="terminalId" th:value="${configuracao.terminalId}" required>
                                    <div class="invalid-feedback">
                                        Terminal ID é obrigatório
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="posAutCode" class="form-label">POS Aut Code *</label>
                                    <input type="text" class="form-control" id="posAutCode" th:value="${configuracao.posAutCode}" required>
                                    <div class="invalid-feedback">
                                        POS Aut Code é obrigatório
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <label for="returnUrl" class="form-label">URL de Retorno *</label>
                                    <input type="url" class="form-control" id="returnUrl" th:value="${configuracao.returnUrl}" required>
                                    <div class="invalid-feedback">
                                        URL de Retorno é obrigatória e deve ser uma URL válida
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="isActive" th:checked="${configuracao.isActive}">
                                    <label class="form-check-label" for="isActive">Ativo</label>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Salvar
                                </button>
                                <a href="/admin/configuracoes" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Voltar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!this.checkValidity()) {
                e.stopPropagation();
                this.classList.add('was-validated');
                return;
            }

            const data = {
                id: document.getElementById('id').value || null,
                posId: document.getElementById('posId').value,
                merchantId: document.getElementById('merchantId').value,
                terminalId: document.getElementById('terminalId').value,
                posAutCode: document.getElementById('posAutCode').value,
                returnUrl: document.getElementById('returnUrl').value,
                isActive: document.getElementById('isActive').checked,
                returnAutCode: document.getElementById('returnAutCode').value || null
            };

            // Gera API Key automaticamente para novas configurações
            if (!data.id) {
                data.apiKey = generateApiKey();
            }

            Swal.fire({
                title: 'Salvando...',
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            fetch('/admin/configuracoes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erro ao salvar configuração');
                }
                return response.json();
            })
            .then(result => {
                Swal.fire({
                    icon: 'success',
                    title: 'Sucesso!',
                    text: 'Configuração salva com sucesso.',
                    confirmButtonText: 'OK'
                }).then(() => {
                    if (!data.id && result.apiKey) {
                        let htmlContent = `
                            <p>Suas credenciais foram geradas. Guarde-as em um local seguro:</p>
                            <div class="mb-3">
                                <label class="form-label">API Key:</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" value="${result.apiKey}" id="apiKeyInput" readonly>
                                    <button class="btn btn-outline-secondary" type="button" onclick="copyToClipboard(this, 'apiKeyInput')">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">API Secret:</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" value="${result.apiSecret}" id="apiSecretInput" readonly>
                                    <button class="btn btn-outline-secondary" type="button" onclick="copyToClipboard(this, 'apiSecretInput')">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>`;
                            
                        // Adicionar o Return Auth Code se estiver disponível
                        if (result.returnAutCode) {
                            htmlContent += `
                                <div class="mb-3">
                                    <label class="form-label">Return Auth Code:</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" value="${result.returnAutCode}" id="returnAutCodeInput" readonly>
                                        <button class="btn btn-outline-secondary" type="button" onclick="copyToClipboard(this, 'returnAutCodeInput')">
                                            <i class="bi bi-clipboard"></i>
                                        </button>
                                    </div>
                                </div>`;
                        }
                        
                        Swal.fire({
                            icon: 'info',
                            title: 'Credenciais Geradas',
                            html: htmlContent,
                            confirmButtonText: 'OK'
                        }).then(() => {
                            window.location.href = '/admin/configuracoes';
                        });
                    } else {
                        window.location.href = '/admin/configuracoes';
                    }
                });
            })
            .catch(error => {
                Swal.fire({
                    icon: 'error',
                    title: 'Erro!',
                    text: error.message,
                    confirmButtonText: 'OK'
                });
            });
        });

        function generateApiKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let apiKey = '';
            for (let i = 0; i < 32; i++) {
                apiKey += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return apiKey;
        }

        function copyToClipboard(button, inputId) {
            const input = document.getElementById(inputId);
            input.select();
            document.execCommand('copy');
            
            const originalHtml = button.innerHTML;
            button.innerHTML = '<i class="bi bi-check"></i>';
            setTimeout(() => {
                button.innerHTML = originalHtml;
            }, 1500);
        }
    </script>
</body>
</html>
