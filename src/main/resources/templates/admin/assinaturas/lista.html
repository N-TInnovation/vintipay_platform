<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt"
      th:replace="~{admin/layout/base :: html(
        title='Assinaturas',
        activeMenu='assinaturas',
        pageTitle='Gerenciamento de Assinaturas',
        content=~{::content},
        additionalCss=~{::additionalCss},
        additionalJs=~{::additionalJs}
      )}">
<head>
    <additionalCss>
        <!-- CSS específico da página -->
    </additionalCss>
</head>
<body>
    <content>
        <!-- Botões de ação -->
        <div class="d-flex justify-content-end mb-4">
            <a th:href="@{/admin/assinaturas/nova}" class="btn btn-primary">
                <i class="fas fa-plus me-2"></i> Nova Assinatura
            </a>
        </div>
        
        <!-- Tabela de Assinaturas -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(assinaturas)}" class="text-center py-5">
                    <i class="fas fa-exclamation-circle fa-3x text-muted mb-3"></i>
                    <h5>Nenhuma assinatura encontrada</h5>
                    <p class="text-muted">Não há assinaturas registradas no sistema.</p>
                    <a th:href="@{/admin/assinaturas/nova}" class="btn btn-primary mt-3">
                        <i class="fas fa-plus me-2"></i> Criar Nova Assinatura
                    </a>
                </div>
                
                <div th:if="${not #lists.isEmpty(assinaturas)}" class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Usuário</th>
                                <th>Plano</th>
                                <th>Data de Início</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="assinatura : ${assinaturas}">
                                <td th:text="${assinatura.id}">1</td>
                                <td>
                                    <a th:href="@{/admin/usuarios/{id}(id=${assinatura.usuario.id})}" 
                                       th:text="${assinatura.usuario.nome}">
                                        Nome do Usuário
                                    </a>
                                </td>
                                <td th:text="${assinatura.plano.nome}">Plano Básico</td>
                                <td th:text="${#temporals.format(assinatura.dataInicio, 'dd/MM/yyyy')}">01/01/2025</td>
                                <td>
                                    <span th:if="${assinatura.status.name() == 'ATIVA'}" class="badge bg-success">Ativa</span>
                                    <span th:if="${assinatura.status.name() == 'TRIAL'}" class="badge bg-info">Trial</span>
                                    <span th:if="${assinatura.status.name() == 'CANCELADA'}" class="badge bg-danger">Cancelada</span>
                                    <span th:if="${assinatura.status.name() == 'SUSPENSA'}" class="badge bg-warning">Suspensa</span>
                                    <span th:if="${assinatura.status.name() == 'EXPIRADA'}" class="badge bg-secondary">Expirada</span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group">
                                        <a th:href="@{/admin/assinaturas/{id}(id=${assinatura.usuario.id})}" 
                                           class="btn btn-sm btn-outline-primary" title="Detalhes">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <button th:if="${assinatura.status.name() != 'CANCELADA'}" 
                                                class="btn btn-sm btn-outline-danger" 
                                                th:onclick="'confirmAction(\'Tem certeza que deseja cancelar esta assinatura?\', function() { window.location.href = \'' + @{/admin/assinaturas/{id}/cancelar(id=${assinatura.usuario.id})} + '\'; })'">
                                            <i class="fas fa-ban"></i>
                                        </button>
                                        <button th:if="${assinatura.status.name() == 'CANCELADA' or assinatura.status.name() == 'EXPIRADA'}" 
                                                class="btn btn-sm btn-outline-success" 
                                                th:onclick="'confirmAction(\'Tem certeza que deseja renovar esta assinatura?\', function() { window.location.href = \'' + @{/admin/assinaturas/{id}/renovar(id=${assinatura.usuario.id})} + '\'; })'">
                                            <i class="fas fa-sync"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </content>
    
    <additionalJs>
        <!-- Incluir o fragmento de alerta modal -->
        <div th:replace="~{admin/fragments/alert-modal :: alertScript}"></div>
    </additionalJs>
</body>
</html>
