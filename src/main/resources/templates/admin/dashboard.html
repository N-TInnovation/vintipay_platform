<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gateway de Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .stat-card {
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            color: white;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .stat-card.total { background-color: #0d6efd; }
        .stat-card.confirmados { background-color: #198754; }
        .stat-card.pendentes { 
            background-color: #ffc107; 
            color: #000; /* Texto preto para o card amarelo */
        }
        .stat-card.cancelados { background-color: #dc3545; }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1); /* Sombra suave para melhor legibilidade */
        }
        .stat-label {
            font-size: 0.9rem;
            font-weight: 500; /* Aumentado peso da fonte */
            opacity: 1; /* Removida opacidade */
        }
        .stat-icon {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .quick-actions {
            margin-top: 2rem;
        }
        .action-card {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
            display: flex;
            align-items: center;
            border: 1px solid #e9ecef;
        }
        .action-card:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .action-icon {
            font-size: 1.5rem;
            margin-right: 1rem;
            width: 40px;
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h2 class="mb-4">Dashboard</h2>
        
        <!-- Statistics -->
        <div class="row g-3">
            <div class="col-md-3">
                <div class="stat-card total">
                    <i class="fas fa-money-bill-wave stat-icon"></i>
                    <div class="stat-value" th:text="${totalPagamentos ?: 2}">2</div>
                    <div class="stat-label">Total de Pagamentos</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card confirmados">
                    <i class="fas fa-check-circle stat-icon"></i>
                    <div class="stat-value" th:text="${pagamentosPagos ?: 0}">0</div>
                    <div class="stat-label">Pagamentos Confirmados</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card pendentes">
                    <i class="fas fa-clock stat-icon"></i>
                    <div class="stat-value" th:text="${pagamentosPendentes ?: 1}">1</div>
                    <div class="stat-label">Pagamentos Pendentes</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card cancelados">
                    <i class="fas fa-times-circle stat-icon"></i>
                    <div class="stat-value" th:text="${pagamentosCancelados ?: 1}">1</div>
                    <div class="stat-label">Pagamentos Cancelados</div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <h4 class="mb-4">Ações Rápidas</h4>
            <div class="row">
                <div class="col-md-6">
                    <a href="/admin/pagamentos" class="action-card">
                        <i class="fas fa-list action-icon"></i>
                        <div>
                            <h5 class="mb-1">Lista de Pagamentos</h5>
                            <p class="mb-0 text-muted">Visualize e gerencie todos os pagamentos</p>
                        </div>
                    </a>
                </div>
                <div class="col-md-6">
                    <a href="/admin/configuracoes" class="action-card">
                        <i class="fas fa-cog action-icon"></i>
                        <div>
                            <h5 class="mb-1">Configurações</h5>
                            <p class="mb-0 text-muted">Configure parâmetros do gateway</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
