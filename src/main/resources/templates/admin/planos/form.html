<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${planoId != null ? 'Editar Plano' : 'Novo Plano'} + ' - VintiPay'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/admin}">
                                <i class="bi bi-speedometer2 me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white" th:href="@{/admin/planos}">
                                <i class="bi bi-card-list me-2"></i> Planos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/admin/usuarios}">
                                <i class="bi bi-people me-2"></i> Usuários
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/admin/assinaturas}">
                                <i class="bi bi-credit-card me-2"></i> Assinaturas
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
            
            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2" th:text="${planoId != null ? 'Editar Plano' : 'Novo Plano'}"></h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/admin/planos}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Voltar
                        </a>
                    </div>
                </div>
                
                <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
                
                <div class="card">
                    <div class="card-body">
                        <form th:action="${planoId != null ? '/admin/planos/editar/' + planoId : '/admin/planos/novo'}" 
                              th:object="${planoRequest}" method="post">
                            
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome do Plano</label>
                                <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="descricao" class="form-label">Descrição</label>
                                <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="3"></textarea>
                                <div class="text-danger" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="preco" class="form-label">Preço (R$)</label>
                                    <input type="number" class="form-control" id="preco" th:field="*{preco}" step="0.01" min="0" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></div>
                                </div>
                                
                                <div class="col-md-6">
                                    <label for="periodoCobranca" class="form-label">Período de Cobrança</label>
                                    <select class="form-select" id="periodoCobranca" th:field="*{periodoCobranca}" required>
                                        <option value="">Selecione...</option>
                                        <option th:each="periodo : ${periodosCobranca}" 
                                                th:value="${periodo}" 
                                                th:text="${periodo}"></option>
                                    </select>
                                    <div class="text-danger" th:if="${#fields.hasErrors('periodoCobranca')}" th:errors="*{periodoCobranca}"></div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="diasTrial" class="form-label">Dias de Teste Grátis (0 para nenhum)</label>
                                <input type="number" class="form-control" id="diasTrial" th:field="*{diasTrial}" min="0">
                                <div class="text-danger" th:if="${#fields.hasErrors('diasTrial')}" th:errors="*{diasTrial}"></div>
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/admin/planos}" class="btn btn-secondary me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
