<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt"
      th:replace="~{admin/layout/base :: html(
        title=${planoId != null ? 'Editar Plano' : 'Novo Plano'},
        activeMenu='planos',
        pageTitle=${planoId != null ? 'Editar Plano' : 'Novo Plano'},
        content=~{::content},
        additionalCss=~{::additionalCss},
        additionalJs=~{::additionalJs}
      )}">
<head>
    <additionalCss>
        <!-- CSS específico da página -->
    </additionalCss>
</head>
<body>
    <content>
        <!-- Botões de ação -->
        <div class="d-flex justify-content-end mb-4">
            <a th:href="@{/admin/planos}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i> Voltar para Lista
            </a>
        </div>
        
        <!-- Formulário -->
        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="${planoId != null ? '/admin/planos/editar/' + planoId : '/admin/planos/novo'}" method="post" th:object="${planoRequest}">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome do Plano</label>
                        <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">
                            Por favor, informe um nome válido.
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="3"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">
                            Por favor, informe uma descrição válida.
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="preco" class="form-label">Preço (ECV)</label>
                            <div class="input-group">
                                <span class="input-group-text">ECV</span>
                                <input type="number" class="form-control" id="preco" th:field="*{preco}" step="0.01" min="0" required>
                            </div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}">
                                Por favor, informe um preço válido.
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <label for="periodoCobranca" class="form-label">Período de Cobrança</label>
                            <select class="form-select" id="periodoCobranca" th:field="*{periodoCobranca}" required>
                                <option value="">Selecione...</option>
                                <option th:each="periodo : ${T(cv.ntinnovation.vintipay.application.core.domain.entity.Plano.PeriodoCobranca).values()}" 
                                        th:value="${periodo}" 
                                        th:text="${periodo.descricao}">Período</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('periodoCobranca')}" th:errors="*{periodoCobranca}">
                                Por favor, selecione um período de cobrança.
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="diasTrial" class="form-label">Dias de Trial (0 para nenhum)</label>
                        <input type="number" class="form-control" id="diasTrial" th:field="*{diasTrial}" min="0">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('diasTrial')}" th:errors="*{diasTrial}">
                            Por favor, informe um número válido de dias.
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="stripePriceId" class="form-label">ID do Preço no Stripe</label>
                        <input type="text" class="form-control" id="stripePriceId" th:field="*{stripePriceId}">
                        <div class="form-text">Deixe em branco para criar automaticamente no Stripe.</div>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('stripePriceId')}" th:errors="*{stripePriceId}">
                            ID de preço inválido.
                        </div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="ativo" th:field="*{ativo}">
                        <label class="form-check-label" for="ativo">Plano Ativo</label>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </content>
    
    <additionalJs>
        <!-- Incluir o fragmento de alerta modal -->
        <div th:replace="~{admin/fragments/alert-modal :: alertScript}"></div>
        
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                // Verificar se há mensagens no modelo
                const mensagemSucesso = /*[[${mensagemSucesso}]]*/ null;
                const mensagemErro = /*[[${mensagemErro}]]*/ null;
                
                if (mensagemSucesso) {
                    showAlert('success', 'Sucesso!', mensagemSucesso);
                } else if (mensagemErro) {
                    showAlert('error', 'Erro!', mensagemErro);
                }
            });
        </script>
    </additionalJs>
</body>
</html>
