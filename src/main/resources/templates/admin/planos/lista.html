<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt"
      th:replace="~{admin/layout/base :: html(
        title='Planos',
        activeMenu='planos',
        pageTitle='Gerenciamento de Planos',
        content=~{::content},
        additionalCss=~{::additionalCss},
        additionalJs=~{::additionalJs}
      )}">
<head>
    <additionalCss>
        <!-- CSS específico da página -->
    </additionalCss>
</head>
<body>
    <content>
        <!-- Botão de adicionar plano -->
        <div class="d-flex justify-content-end mb-4">
            <a th:href="@{/admin/planos/novo}" class="btn btn-primary">
                <i class="fas fa-plus me-2"></i> Novo Plano
            </a>
        </div>
        
        <!-- Tabela de Planos -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(planos)}" class="text-center py-5">
                    <i class="fas fa-tags fa-3x text-muted mb-3"></i>
                    <h5>Nenhum plano encontrado</h5>
                    <p class="text-muted">Não há planos cadastrados no sistema.</p>
                </div>
                
                <div th:if="${not #lists.isEmpty(planos)}" class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Preço</th>
                                <th>Período</th>
                                <th>Dias Trial</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="plano : ${planos}">
                                <td th:text="${plano.id}">1</td>
                                <td th:text="${plano.nome}">Plano Básico</td>
                                <td>ECV <span th:text="${#numbers.formatDecimal(plano.preco, 1, 2, 'POINT')}">99.90</span></td>
                                <td th:text="${plano.periodoCobranca}">MENSAL</td>
                                <td th:text="${plano.diasTrial}">15</td>
                                <td>
                                    <span th:if="${plano.ativo}" class="badge bg-success">Ativo</span>
                                    <span th:unless="${plano.ativo}" class="badge bg-danger">Inativo</span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group">
                                        <a th:href="@{/admin/planos/editar/{id}(id=${plano.id})}" class="btn btn-sm btn-outline-primary">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <button th:if="${plano.ativo}" class="btn btn-sm btn-outline-danger" 
                                                th:onclick="'confirmAction(\'Tem certeza que deseja desativar este plano?\', function() { window.location.href = \'' + @{/admin/planos/desativar/{id}(id=${plano.id})} + '\'; })'">
                                            <i class="fas fa-times"></i>
                                        </button>
                                        <button th:unless="${plano.ativo}" class="btn btn-sm btn-outline-success" 
                                                th:onclick="'confirmAction(\'Tem certeza que deseja ativar este plano?\', function() { window.location.href = \'' + @{/admin/planos/ativar/{id}(id=${plano.id})} + '\'; })'">
                                            <i class="fas fa-check"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Paginação -->
                <nav th:if="${totalPages > 1}" aria-label="Navegação de páginas">
                    <ul class="pagination justify-content-center mt-4">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/planos(page=0)}" aria-label="Primeira">
                                <span aria-hidden="true">&laquo;&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/planos(page=${currentPage - 1})}" aria-label="Anterior">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                            <a class="page-link" th:href="@{/admin/planos(page=${i})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/planos(page=${currentPage + 1})}" aria-label="Próxima">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/planos(page=${totalPages - 1})}" aria-label="Última">
                                <span aria-hidden="true">&raquo;&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </content>
    
    <additionalJs>
        <!-- Incluir o fragmento de alerta modal -->
        <div th:replace="~{admin/fragments/alert-modal :: alertScript}"></div>
    </additionalJs>
</body>
</html>
