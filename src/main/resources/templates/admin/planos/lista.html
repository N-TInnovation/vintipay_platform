<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Planos - VintiPay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/admin}">
                                <i class="bi bi-speedometer2 me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white" th:href="@{/admin/planos}">
                                <i class="bi bi-card-list me-2"></i> Planos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/admin/usuarios}">
                                <i class="bi bi-people me-2"></i> Usuários
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/admin/assinaturas}">
                                <i class="bi bi-credit-card me-2"></i> Assinaturas
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
            
            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Gerenciar Planos</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/admin/planos/novo}" class="btn btn-sm btn-primary">
                            <i class="bi bi-plus-circle me-1"></i> Novo Plano
                        </a>
                    </div>
                </div>
                
                <div th:if="${param.sucesso}" class="alert alert-success" role="alert">
                    Operação realizada com sucesso!
                </div>
                <div th:if="${param.erro}" class="alert alert-danger" role="alert" th:text="${param.erro}"></div>
                
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Preço</th>
                                <th>Período</th>
                                <th>Dias Trial</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="plano : ${planos}">
                                <td th:text="${plano.id}"></td>
                                <td th:text="${plano.nome}"></td>
                                <td>R$ <span th:text="${#numbers.formatDecimal(plano.preco, 0, 'POINT', 2, 'COMMA')}"></span></td>
                                <td th:text="${plano.periodoCobranca}"></td>
                                <td th:text="${plano.diasTrial != null ? plano.diasTrial : 0}"></td>
                                <td>
                                    <span th:if="${plano.ativo}" class="badge bg-success">Ativo</span>
                                    <span th:unless="${plano.ativo}" class="badge bg-danger">Inativo</span>
                                </td>
                                <td>
                                    <div class="btn-group">
                                        <a th:href="@{'/admin/planos/editar/' + ${plano.id}}" class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:if="${plano.ativo}" th:action="@{'/admin/planos/desativar/' + ${plano.id}}" method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Tem certeza que deseja desativar este plano?')">
                                                <i class="bi bi-x-circle"></i>
                                            </button>
                                        </form>
                                        <form th:unless="${plano.ativo}" th:action="@{'/admin/planos/ativar/' + ${plano.id}}" method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-sm btn-outline-success" onclick="return confirm('Tem certeza que deseja ativar este plano?')">
                                                <i class="bi bi-check-circle"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(planos)}">
                                <td colspan="7" class="text-center">Nenhum plano cadastrado</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
