<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Lista de Pagamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .status-badge {
            width: 100px;
        }
        .table-actions {
            width: 100px;
        }
        .status-PENDENTE {
            background-color: #ffc107;
        }
        .status-PAGO {
            background-color: #198754;
            color: white;
        }
        .status-CANCELADO {
            background-color: #dc3545;
            color: white;
        }
        .status-ERRO {
            background-color: #6c757d;
            color: white;
        }
        .pan-mascarado {
            font-family: monospace;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Gateway de Pagamento</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/pagamentos">Pagamentos</a>
                    </li>
                </ul>
                <form th:action="@{/logout}" method="post" class="d-flex">
                    <button class="btn btn-outline-light" type="submit">Sair</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Lista de Pagamentos</h1>
            <div class="d-flex gap-2">
                <a href="/admin" class="btn btn-outline-secondary me-2">
                    <i class="fas fa-arrow-left"></i> Voltar ao Dashboard
                </a>
                <form th:action="@{/admin/pagamentos}" method="get" class="d-flex gap-2">
                    <div class="input-group">
                        <input type="text" class="form-control" name="reference" th:value="${reference}"
                               placeholder="Buscar por referência...">
                        <button class="btn btn-outline-secondary" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <select class="form-select" style="width: auto;" name="status" onchange="this.form.submit()">
                        <option value="">Todos os Status</option>
                        <option value="PENDENTE" th:selected="${statusSelecionado == 'PENDENTE'}">Pendente</option>
                        <option value="PAGO" th:selected="${statusSelecionado == 'PAGO'}">Pago</option>
                        <option value="CANCELADO" th:selected="${statusSelecionado == 'CANCELADO'}">Cancelado</option>
                        <option value="ERRO" th:selected="${statusSelecionado == 'ERRO'}">Erro</option>
                    </select>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Referência</th>
                                <th>Data/Hora</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <th>PAN</th>
                                <th class="table-actions">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pagamento : ${pagamentos}">
                                <td>
                                    <span th:text="${pagamento.reference}">REF123</span>
                                    <small class="d-block text-muted" th:text="${pagamento.fingerprint}">fp123</small>
                                </td>
                                <td>
                                    <span th:text="${#temporals.format(pagamento.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2025 10:00</span>
                                    <small class="d-block text-muted" th:text="${pagamento.timestamp}">2025-01-01 10:00:00</small>
                                </td>
                                <td>
                                    <span th:if="${pagamento.intencaoPagamento != null}" 
                                          th:text="${#numbers.formatDecimal(pagamento.intencaoPagamento.amount, 1, 2)} + ' ' + ${pagamento.intencaoPagamento.currency}">1000.00 CVE</span>
                                    <span th:unless="${pagamento.intencaoPagamento != null}">-</span>
                                </td>
                                <td>
                                    <span th:class="'badge status-' + ${pagamento.status}" 
                                          th:text="${pagamento.status}"
                                          class="badge status-badge">PENDENTE</span>
                                    <small th:if="${pagamento.mensagem}" class="d-block text-muted" th:text="${pagamento.mensagem}">Mensagem</small>
                                </td>
                                <td class="pan-mascarado" th:text="${pagamento.panMascarado ?: '-'}">****1234</td>
                                <td class="table-actions">
                                    <div class="btn-group">
                                        <a th:href="@{/admin/pagamentos/{reference}(reference=${pagamento.reference})}" 
                                           class="btn btn-sm btn-outline-primary" 
                                           title="Ver detalhes">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <button class="btn btn-sm btn-outline-secondary" title="Histórico">
                                            <i class="fas fa-history"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Paginação -->
        <nav th:if="${page.totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${!page.hasPrevious()} ? disabled">
                    <a class="page-link" 
                       th:href="@{/admin/pagamentos(page=${page.number - 1}, reference=${reference}, status=${statusSelecionado})}" 
                       aria-label="Anterior">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${page.number == i} ? active">
                    <a class="page-link" 
                       th:href="@{/admin/pagamentos(page=${i}, reference=${reference}, status=${statusSelecionado})}"
                       th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${!page.hasNext()} ? disabled">
                    <a class="page-link" 
                       th:href="@{/admin/pagamentos(page=${page.number + 1}, reference=${reference}, status=${statusSelecionado})}"
                       aria-label="Próximo">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
