<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Incluir fragmento de favicon reutilizável -->
    <th:block th:replace="~{fragments/head-favicons :: favicons}"></th:block>
    
    <title>Pagamento Cancelado - VintiPay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-warning text-dark text-center">
                        <h3>Pagamento Cancelado</h3>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="bi bi-x-circle-fill text-warning" style="font-size: 4rem;"></i>
                            <h4 class="mt-3">Seu pagamento foi cancelado</h4>
                        </div>
                        
                        <div class="alert alert-warning">
                            <p><strong>Referência:</strong> <span th:text="${pagamento.reference}"></span></p>
                            <p><strong>Valor:</strong> <span th:text="${pagamento.intencaoPagamento.valor + ' ' + pagamento.intencaoPagamento.moeda}"></span></p>
                            <p><strong>Motivo:</strong> <span th:text="${pagamento.mensagem != null ? pagamento.mensagem : 'Pagamento cancelado pelo usuário ou pelo sistema de pagamento'}"></span></p>
                        </div>
                        
                        <div class="text-center mt-4">
                            <a href="/" class="btn btn-primary">Voltar para Página Inicial</a>
                            <a href="javascript:history.back()" class="btn btn-secondary">Voltar</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</body>
</html>
