<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Confirmado - VintiPay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .receipt-container {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            background-color: #f9f9f9;
        }
        .receipt-header {
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .receipt-footer {
            border-top: 1px solid #ddd;
            padding-top: 10px;
            margin-top: 15px;
            font-size: 0.9em;
        }
        .receipt-items {
            margin: 15px 0;
        }
        .download-btn {
            margin-top: 15px;
        }
        .badge-success {
            background-color: #28a745;
            color: white;
        }
        .qr-code {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h3>Pagamento Confirmado</h3>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                            <h4 class="mt-3">Seu pagamento foi processado com sucesso!</h4>
                        </div>
                        
                        <!-- Detalhes do pagamento -->
                        <div class="receipt-container">
                            <div class="receipt-header">
                                <div class="row">
                                    <div class="col-md-6">
                                        <h5>Recibo de Pagamento</h5>
                                        <strong>Referência:</strong> <span th:text="${pagamento.reference}"></span>
                                    </div>
                                    <div class="col-md-6 text-md-end">
                                        <span class="badge badge-success">PAGO</span>
                                        <div>Data: <span th:text="${#temporals.format(pagamento.createdAt, 'dd/MM/yyyy HH:mm')}"></span></div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Detalhes da transação -->
                            <div class="receipt-items">
                                <div class="row">
                                    <div class="col-md-6">
                                        <strong>Cliente:</strong>
                                        <div th:text="${pagamento.intencaoPagamento.contaPagamento.name}"></div>
                                        <div th:text="${pagamento.intencaoPagamento.contaPagamento.email}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <strong>Detalhes do Pagamento:</strong>
                                        <div>Valor: <span th:text="${pagamento.intencaoPagamento.valor + ' ' + pagamento.intencaoPagamento.moeda}"></span></div>
                                        <div th:if="${pagamento.metodo != null}">Método: <span th:text="${pagamento.metodo}"></span></div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Informações do recibo Vendus, se disponível -->
                            <div th:if="${vendusReceipt != null}" class="receipt-footer">
                                <div class="row">
                                    <div class="col-md-6">
                                        <strong>Recibo Fiscal Vendus</strong>
                                        <div>Número: <span th:text="${vendusReceipt.number}"></span></div>
                                        <div>Emissão: <span th:text="${vendusReceipt.date}"></span></div>
                                    </div>
                                    <div class="col-md-6 text-md-end">
                                        <a th:if="${vendusReceipt.url != null}" th:href="${vendusReceipt.url}" target="_blank" class="btn btn-sm btn-primary">
                                            <i class="bi bi-eye"></i> Visualizar
                                        </a>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Botões para download e opções -->
                            <div class="mt-4 text-center">
                                <a href="#" id="downloadPdfBtn" class="btn btn-success download-btn">
                                    <i class="bi bi-file-earmark-pdf"></i> Baixar Recibo em PDF
                                </a>
                                <a href="#" id="enviarPorEmailBtn" class="btn btn-outline-primary download-btn ms-2">
                                    <i class="bi bi-envelope"></i> Enviar por Email
                                </a>
                            </div>
                            
                            <!-- QR Code para validação (pode ser implementado posteriormente) -->
                            <div class="qr-code">
                                <img th:src="@{'/recibo/api/qrcode/' + ${pagamento.reference}}" alt="QR Code de validação" width="100" height="100" />
                                <div>Escaneie para validar</div>
                            </div>
                        </div>
                        
                        <div class="text-center mt-4">
                            <a href="/" class="btn btn-primary">Voltar para Página Inicial</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Script para download do PDF
        document.getElementById('downloadPdfBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = '/recibo/download/pdf/' + '[[${pagamento.reference}]]';
        });
        
        // Script para enviar por email
        document.getElementById('enviarPorEmailBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const email = prompt("Por favor, digite seu email para receber o recibo:");
            if (email) {
                fetch('/recibo/enviar-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        referencia: '[[${pagamento.reference}]]'
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Recibo enviado com sucesso para o email ' + email);
                    } else {
                        alert('Erro ao enviar o recibo. Por favor, tente novamente.');
                    }
                });
            }
        });
    </script>
</body>
</html>
