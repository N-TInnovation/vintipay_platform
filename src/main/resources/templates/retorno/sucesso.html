<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Confirmado - VintiPay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h3>Pagamento Confirmado</h3>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                            <h4 class="mt-3">Seu pagamento foi processado com sucesso!</h4>
                        </div>
                        
                        <div class="alert alert-success">
                            <p><strong>Referência:</strong> <span th:text="${pagamento.reference}"></span></p>
                            <p><strong>Valor:</strong> <span th:text="${pagamento.intencaoPagamento.valor + ' ' + pagamento.intencaoPagamento.moeda}"></span></p>
                            <p><strong>Data:</strong> <span th:text="${#temporals.format(pagamento.dataProcessamento, 'dd/MM/yyyy HH:mm')}"></span></p>
                        </div>
                        
                        <!-- Informações do recibo Vendus, se disponível -->
                        <div th:if="${vendusReceipt != null}" class="mt-4">
                            <h5>Recibo Fiscal</h5>
                            <div class="alert alert-info">
                                <p><strong>Número do Recibo:</strong> <span th:text="${vendusReceipt.number}"></span></p>
                                <p><strong>Data de Emissão:</strong> <span th:text="${vendusReceipt.date}"></span></p>
                                <p th:if="${vendusReceipt.url != null}">
                                    <a th:href="${vendusReceipt.url}" target="_blank" class="btn btn-primary">
                                        <i class="bi bi-file-earmark-pdf"></i> Visualizar Recibo
                                    </a>
                                </p>
                            </div>
                        </div>
                        
                        <div class="text-center mt-4">
                            <a href="/" class="btn btn-primary">Voltar para Página Inicial</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</body>
</html>
