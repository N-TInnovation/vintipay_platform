<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt"
      th:replace="~{user/layout/base :: html(
        title='Criar Organização',
        activeMenu='tenant',
        pageTitle='Criar Nova Organização',
        content=~{::content},
        additionalCss=~{::additionalCss},
        additionalJs=~{::additionalJs}
      )}">
<head>
    <th:block th:replace="~{fragments/head-favicons :: favicons}"></th:block>
    <title>Criar Organização</title>
    <additionalCss>
        <style>
            .form-card {
                border: none;
                border-radius: 15px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
                overflow: hidden;
                background: white;
            }
            
            .form-card-header {
                background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
                color: white;
                padding: 2rem;
                text-align: center;
            }
            
            .form-card-header h4 {
                margin: 0;
                font-weight: 600;
                color: white;
            }
            
            .form-card-header p {
                margin: 0.5rem 0 0;
                opacity: 0.9;
                font-size: 0.95rem;
            }
            
            .form-card-body {
                padding: 2.5rem;
            }
            
            .form-label {
                font-weight: 600;
                color: #2d3748;
                margin-bottom: 0.5rem;
                font-size: 0.9rem;
            }
            
            .form-control, .form-select {
                border: 2px solid #e2e8f0;
                border-radius: 8px;
                padding: 0.75rem 1rem;
                font-size: 0.95rem;
                transition: all 0.3s ease;
            }
            
            .form-control:focus, .form-select:focus {
                border-color: #0d6efd;
                box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
            }
            
            .form-control.is-invalid {
                border-color: #dc3545;
            }
            
            .invalid-feedback {
                font-size: 0.875rem;
                margin-top: 0.25rem;
            }
            
            .btn-primary {
                background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
                border: none;
                border-radius: 8px;
                padding: 0.875rem 2rem;
                font-weight: 600;
                font-size: 1rem;
                box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
                transition: all 0.3s ease;
            }
            
            .btn-primary:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 20px rgba(13, 110, 253, 0.4);
            }
            
            .btn-secondary {
                background: #6c757d;
                border: none;
                border-radius: 8px;
                padding: 0.875rem 2rem;
                font-weight: 600;
                font-size: 1rem;
                transition: all 0.3s ease;
            }
            
            .btn-secondary:hover {
                background: #5a6268;
                transform: translateY(-3px);
            }
            
            .alert {
                border-radius: 10px;
                padding: 1rem 1.25rem;
                margin-bottom: 1.5rem;
                border: none;
                font-weight: 500;
            }
            
            .alert-danger {
                background: rgba(220, 53, 69, 0.1);
                color: #dc3545;
            }
            
            .alert-success {
                background: rgba(25, 135, 84, 0.1);
                color: #198754;
            }
            
            .form-section {
                margin-bottom: 2rem;
                padding-bottom: 2rem;
                border-bottom: 1px solid #e2e8f0;
            }
            
            .form-section:last-child {
                border-bottom: none;
                margin-bottom: 0;
                padding-bottom: 0;
            }
            
            .form-section-title {
                font-size: 1.1rem;
                font-weight: 700;
                color: #1e293b;
                margin-bottom: 1.5rem;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            
            .form-section-title i {
                color: #0d6efd;
            }
            
            .required-field::after {
                content: " *";
                color: #dc3545;
            }
            
            .form-helper-text {
                font-size: 0.875rem;
                color: #64748b;
                margin-top: 0.25rem;
            }
            
            .icon-input-group {
                position: relative;
            }
            
            .icon-input-group i {
                position: absolute;
                left: 1rem;
                top: 50%;
                transform: translateY(-50%);
                color: #64748b;
            }
            
            .icon-input-group .form-control {
                padding-left: 2.75rem;
            }
            
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            
            .form-card {
                animation: fadeIn 0.5s ease;
            }
        </style>
    </additionalCss>
</head>
<body>
    <content>
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="form-card">
                    <div class="form-card-header">
                        <h4><i class="fas fa-building me-2"></i>Criar Nova Organização</h4>
                        <p>Preencha os dados abaixo para criar sua organização</p>
                    </div>
                    
                    <div class="form-card-body">
                        <div th:if="${erro}" class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${erro}"></span>
                        </div>
                        
                        <div th:if="${sucesso}" class="alert alert-success" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${sucesso}"></span>
                        </div>
                        
                        <form th:action="@{/user/tenant/create}" th:object="${tenantRequest}" method="post">
                            
                            <div class="form-section">
                                <div class="form-section-title">
                                    <i class="fas fa-info-circle"></i>
                                    Informações Básicas
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-12 mb-3">
                                        <label for="nome" class="form-label required-field">Nome da Organização</label>
                                        <div class="icon-input-group">
                                            <i class="fas fa-building"></i>
                                            <input type="text" 
                                                   class="form-control" 
                                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''"
                                                   id="nome" 
                                                   th:field="*{nome}"
                                                   placeholder="Ex: Minha Empresa Ltda"
                                                   required>
                                        </div>
                                        <div class="form-helper-text">Este será o nome oficial da sua organização</div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                                    </div>
                                    
                                    <div class="col-md-6 mb-3">
                                        <label for="nomeFantasia" class="form-label">Nome Fantasia</label>
                                        <div class="icon-input-group">
                                            <i class="fas fa-tag"></i>
                                            <input type="text" 
                                                   class="form-control"
                                                   th:classappend="${#fields.hasErrors('nomeFantasia')} ? 'is-invalid' : ''"
                                                   id="nomeFantasia" 
                                                   th:field="*{nomeFantasia}"
                                                   placeholder="Nome comercial (opcional)">
                                        </div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nomeFantasia')}" th:errors="*{nomeFantasia}"></div>
                                    </div>
                                    
                                    <div class="col-md-6 mb-3">
                                        <label for="documento" class="form-label">Documento (NIF/NIPC)</label>
                                        <div class="icon-input-group">
                                            <i class="fas fa-id-card"></i>
                                            <input type="text" 
                                                   class="form-control"
                                                   th:classappend="${#fields.hasErrors('documento')} ? 'is-invalid' : ''"
                                                   id="documento" 
                                                   th:field="*{documento}"
                                                   placeholder="Ex: 123456789">
                                        </div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-section">
                                <div class="form-section-title">
                                    <i class="fas fa-address-book"></i>
                                    Informações de Contato
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <div class="icon-input-group">
                                            <i class="fas fa-envelope"></i>
                                            <input type="email" 
                                                   class="form-control"
                                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                                   id="email" 
                                                   th:field="*{email}"
                                                   placeholder="contato@empresa.com">
                                        </div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                    </div>
                                    
                                    <div class="col-md-6 mb-3">
                                        <label for="telefone" class="form-label">Telefone</label>
                                        <div class="icon-input-group">
                                            <i class="fas fa-phone"></i>
                                            <input type="text" 
                                                   class="form-control"
                                                   th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid' : ''"
                                                   id="telefone" 
                                                   th:field="*{telefone}"
                                                   placeholder="+238 999 99 99">
                                        </div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-section">
                                <div class="form-section-title">
                                    <i class="fas fa-map-marker-alt"></i>
                                    Localização
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-12 mb-3">
                                        <label for="endereco" class="form-label">Endereço</label>
                                        <div class="icon-input-group">
                                            <i class="fas fa-home"></i>
                                            <input type="text" 
                                                   class="form-control"
                                                   th:classappend="${#fields.hasErrors('endereco')} ? 'is-invalid' : ''"
                                                   id="endereco" 
                                                   th:field="*{endereco}"
                                                   placeholder="Rua, número, bairro">
                                        </div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('endereco')}" th:errors="*{endereco}"></div>
                                    </div>
                                    
                                    <div class="col-md-6 mb-3">
                                        <label for="cidade" class="form-label">Cidade</label>
                                        <div class="icon-input-group">
                                            <i class="fas fa-city"></i>
                                            <input type="text" 
                                                   class="form-control"
                                                   th:classappend="${#fields.hasErrors('cidade')} ? 'is-invalid' : ''"
                                                   id="cidade" 
                                                   th:field="*{cidade}"
                                                   placeholder="Praia">
                                        </div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></div>
                                    </div>
                                    
                                    <div class="col-md-6 mb-3">
                                        <label for="pais" class="form-label">País</label>
                                        <div class="icon-input-group">
                                            <i class="fas fa-globe"></i>
                                            <input type="text" 
                                                   class="form-control"
                                                   th:classappend="${#fields.hasErrors('pais')} ? 'is-invalid' : ''"
                                                   id="pais" 
                                                   th:field="*{pais}"
                                                   placeholder="Cabo Verde">
                                        </div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('pais')}" th:errors="*{pais}"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-section">
                                <div class="form-section-title">
                                    <i class="fas fa-comments"></i>
                                    Informações Adicionais
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-12 mb-3">
                                        <label for="observacoes" class="form-label">Observações</label>
                                        <textarea class="form-control"
                                                  th:classappend="${#fields.hasErrors('observacoes')} ? 'is-invalid' : ''"
                                                  id="observacoes" 
                                                  th:field="*{observacoes}"
                                                  rows="4"
                                                  placeholder="Informações adicionais sobre a organização (opcional)"></textarea>
                                        <div class="form-helper-text">Utilize este espaço para adicionar qualquer informação relevante</div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('observacoes')}" th:errors="*{observacoes}"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between mt-4">
                                <a href="/user" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Criar Organização
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </content>
    
    <additionalJs>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const form = document.querySelector('form');
                
                form.addEventListener('submit', function(e) {
                    const submitButton = form.querySelector('button[type="submit"]');
                    submitButton.disabled = true;
                    submitButton.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Criando...';
                });
                
                const nomeInput = document.getElementById('nome');
                nomeInput.focus();
            });
        </script>
    </additionalJs>
</body>
</html>
