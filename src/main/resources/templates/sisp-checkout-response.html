<html>
    <head>
        <title>Pagamento vinti4</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    </head>
    <body onload="autoPost()">
        <h1 class="animate__animated animate__infinite animate__pulse" style="text-align: center;position: relative;margin-top: 25%;">Processando o pagamento...</h1>
        <form th:action="@{${submitFormUrl}}" th:object="${response}" method="post">
            <input type="hidden"
                   th:if="*{transactionId}"
                   th:value="*{transactionId}"
                   name="transactionId">
            <input type="hidden"
                   th:if="*{status}"
                   th:value="*{status}"
                   name="status">
            <input type="hidden"
                   th:if="*{channelCode}"
                   th:value="*{channelCode}"
                   name="channelCode">
            <input type="hidden"
                   th:if="*{merchantRespErrorDescription}"
                   th:value="*{merchantRespErrorDescription}"
                   name="merchantRespErrorDescription">
            <input type="hidden"
                   th:if="*{merchantRespMerchantRef}"
                   th:value="*{merchantRespMerchantRef}"
                   name="merchantRespMerchantRef">
            <input type="hidden"
                   th:if="*{merchantRespMerchantSession}"
                   th:value="*{merchantRespMerchantSession}"
                   name="merchantRespMerchantSession">
            <input type="hidden"
                   th:if="*{type}"
                   th:value="*{type}"
                   name="type">
            <input type="hidden"
                   th:if="*{merchantRespPan}"
                   th:value="*{merchantRespPan}"
                   name="merchantRespPan">
            <input type="hidden"
                   th:if="*{paymentMethod}"
                   th:value="*{paymentMethod}"
                   name="paymentMethod">
            <input type="hidden"
                   th:if="*{subscription}"
                   th:value="*{subscription}"
                   name="subscription">
            <input type="hidden"
                   th:if="*{updated}"
                   th:value="*{updated}"
                   name="updated">
            <input type="hidden"
                   th:if="*{callBackType}"
                   th:value="*{callBackType}"
                   name="callBackType">
            <input type="hidden"
                   th:if="*{asignature}"
                   th:value="*{asignature}"
                   name="asignature">

        </form>
        <script>
            function autoPost(){document.forms[0].submit();}
        </script>
    </body>
</html>
