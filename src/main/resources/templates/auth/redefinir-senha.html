<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - VintiPay</title>
    
    <!-- Incluir fragmento de favicon reutilizável -->
    <th:block th:replace="fragments/head-favicons :: favicons"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .reset-container {
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #3a0ca3 0%, #4361ee 100%);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            position: relative;
            border-bottom: none;
        }
        .card-header::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 0;
            right: 0;
            height: 30px;
            background: white;
            border-radius: 50% 50% 0 0;
            z-index: 2;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
            transition: all 0.3s ease;
        }
        .btn-primary:hover, .btn-primary:focus {
            background: linear-gradient(135deg, #3a0ca3 0%, #4361ee 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
        }
        .alert {
            border-radius: 8px;
            font-weight: 500;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #4361ee;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="card">
            <div class="card-header">
                <img src="/img/logo.png" alt="Logo" class="logo mb-3" onerror="this.onerror=null; this.src='/img/payment-icon.png';" style="max-height: 48px;">
                <h4 class="mb-0">Redefinir Senha</h4>
                <p class="mb-0">Crie uma nova senha segura</p>
            </div>
            <div class="card-body p-4">
                <div th:if="${error}" class="alert alert-danger mb-4" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}">Erro</span>
                </div>
                
                <form th:action="@{/redefinir-senha}" method="post" id="resetForm">
                    <input type="hidden" name="token" th:value="${token}">
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Nova senha</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" 
                                   required minlength="8" 
                                   oninput="checkPasswordStrength(this.value)" 
                                   placeholder="Mínimo de 8 caracteres">
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="progress password-strength mt-2">
                            <div id="passwordStrength" class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                        <small class="form-text text-muted">A senha deve ter no mínimo 8 caracteres</small>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Confirme a nova senha</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                                   required minlength="8"
                                   oninput="checkPasswordMatch()">
                            <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div id="passwordMatch" class="form-text"></div>
                    </div>
                    
                    <button class="w-100 btn btn-lg btn-primary" type="submit" id="submitBtn">
                        <i class="fas fa-key me-2"></i> Redefinir Senha
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // Check password strength
        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('passwordStrength');
            
            // Default - too short
            let strength = 0;
            let color = '#dc3545'; // red
            
            // If password length is >= 8 chars
            if (password.length >= 8) {
                strength = 25;
                color = '#dc3545'; // still red
                
                // If has lowercase and uppercase
                if (/[a-z]/.test(password) && /[A-Z]/.test(password)) {
                    strength = 50;
                    color = '#ffc107'; // yellow
                }
                
                // If has numbers
                if (/\d/.test(password)) {
                    strength = 75;
                    color = '#0dcaf0'; // light blue
                }
                
                // If has special chars
                if (/[^a-zA-Z0-9]/.test(password)) {
                    strength = 100;
                    color = '#198754'; // green
                }
            }
            
            strengthBar.style.width = strength + '%';
            strengthBar.style.backgroundColor = color;
        }
        
        // Check if passwords match
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const passwordMatch = document.getElementById('passwordMatch');
            
            if (confirmPassword.length === 0) {
                passwordMatch.textContent = '';
                passwordMatch.className = 'form-text';
                return;
            }
            
            if (password === confirmPassword) {
                passwordMatch.textContent = 'As senhas coincidem!';
                passwordMatch.className = 'form-text text-success';
            } else {
                passwordMatch.textContent = 'As senhas não coincidem!';
                passwordMatch.className = 'form-text text-danger';
            }
        }
        
        // Form validation before submit
        document.getElementById('resetForm').addEventListener('submit', function(event) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                event.preventDefault();
                alert('As senhas não coincidem. Por favor, verifique.');
            }
        });
    </script>
</body>
</html>
