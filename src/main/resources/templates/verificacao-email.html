<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Email - VintiPay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .verification-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        
        .success-message {
            color: #28a745;
            padding: 15px;
            border-radius: 4px;
            background-color: rgba(40, 167, 69, 0.1);
            border: 1px solid rgba(40, 167, 69, 0.2);
        }
        
        .error-message {
            color: #dc3545;
            padding: 15px;
            border-radius: 4px;
            background-color: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.2);
        }
        
        .reenvio-form {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="verification-container">
            <div class="text-center mb-4">
                <img th:src="@{/images/logo.png}" alt="VintiPay Logo" width="150" class="mb-3">
                <h2>Verificação de Email</h2>
            </div>
            
            <div th:if="${tipo == 'sucesso'}" class="success-message mb-4">
                <p class="mb-0" th:text="${mensagem}">Email verificado com sucesso!</p>
            </div>
            
            <div th:if="${tipo == 'erro'}" class="error-message mb-4">
                <p class="mb-0" th:text="${mensagem}">Ocorreu um erro durante a verificação.</p>
            </div>
            
            <div th:if="${tipo == 'sucesso'}" class="text-center mt-4">
                <a th:href="@{/login}" class="btn btn-primary">Fazer Login</a>
            </div>
            
            <div th:if="${reenvio == true}" class="reenvio-form">
                <h5 class="mb-3">Não recebeu o email de verificação?</h5>
                <form th:action="@{/reenviar-verificacao}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    </div>
                    <button type="submit" class="btn btn-outline-primary">Reenviar Email de Verificação</button>
                </form>
            </div>
            
            <div class="text-center mt-4">
                <a th:href="@{/}" class="btn btn-link">Voltar para a Página Inicial</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
