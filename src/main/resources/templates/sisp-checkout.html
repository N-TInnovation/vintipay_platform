<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento vinti4</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <!-- Incluir fragmento de favicon reutilizável -->
    <th:block th:replace="~{fragments/head-favicons :: favicons}"></th:block>
</head>
<body onload="autoPost()">
    <h1 class="animate__animated animate__infinite animate__pulse" style="text-align: center;position: relative;margin-top: 25%;">Processando o pagamento...</h1>
    <form th:action="@{${request.submitFormUrl}}" th:object="${request}" method="post">
        <input type="hidden"
               th:value="*{timeStamp}"
               name="timeStamp">
        <input type="hidden"
               th:value="*{fingerprint}"
               name="fingerprint">
        <input type="hidden"
               th:value="*{fingerprintversion}"
               name="fingerprintversion">
        <input type="hidden"
               th:value="*{amount}"
               name="amount">
        <input type="hidden"
               th:value="*{transactionCode}"
               name="transactionCode">
        <input type="hidden"
               th:value="*{posID}"
               name="posID">
        <input type="hidden"
               th:value="*{merchantRef}"
               name="merchantRef">
        <input type="hidden"
               th:value="*{merchantSession}"
               name="merchantSession">
        <input type="hidden"
               th:value="*{currency}"
               name="currency">
        <input type="hidden"
               th:value="*{is3DSec}"
               name="is3DSec">
        <input type="hidden"
               th:value="*{urlMerchantResponse}"
               name="urlMerchantResponse">
        <input type="hidden"
               th:value="*{languageMessages}"
               name="languageMessages">

        <!-- opcionais -->
        <input th:if="*{entityCode}" type="hidden"
               th:value="*{entityCode}"
               name="entityCode">

        <input th:if="*{referenceNumber}" type="hidden"
               th:value="*{referenceNumber}"
               name="referenceNumber">

        <input th:if="*{purchaseRequest}" type="hidden"
               th:value="*{purchaseRequest}"
               name="purchaseRequest">

        <input th:if="*{email}" type="hidden"
               th:value="*{email}"
               name="email">

        <input th:if="*{billAddrCity}" type="hidden"
               th:value="*{billAddrCity}"
               name="billAddrCity">

        <input th:if="*{billAddrCountry}" type="hidden"
               th:value="*{billAddrCountry}"
               name="billAddrCountry">

        <input th:if="*{billAddrLine1}" type="hidden"
               th:value="*{billAddrLine1}"
               name="billAddrLine1">

        <input th:if="*{billAddrPostCode}" type="hidden"
               th:value="*{billAddrPostCode}"
               name="billAddrPostCode">
    </form>
    <script>
        function autoPost(){document.forms[0].submit();}
    </script>
</body>
</html>
