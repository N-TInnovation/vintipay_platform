<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Gateway de Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .payment-card {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .payment-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .payment-amount {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
        }
        .payment-info {
            margin-top: 2rem;
        }
        .payment-info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        .payment-info-label {
            color: #7f8c8d;
        }
        .payment-info-value {
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="payment-card bg-white">
            <div class="payment-header">
                <h2>Confirmação de Pagamento</h2>
            </div>
            
            <div class="payment-amount">
                <span th:text="${#numbers.formatDecimal(pagamento.total, 1, 2)}">0.00</span>
                <span th:text="${pagamento.currency}">CVE</span>
            </div>

            <div class="payment-info">
                <div class="payment-info-item">
                    <span class="payment-info-label">Referência</span>
                    <span class="payment-info-value" th:text="${pagamento.merchantRef}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Sessão</span>
                    <span class="payment-info-value" th:text="${pagamento.merchantSession}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Terminal</span>
                    <span class="payment-info-value" th:text="${pagamento.posId}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Código da Transação</span>
                    <span class="payment-info-value" th:text="${pagamento.transactionCode}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Código da Entidade</span>
                    <span class="payment-info-value" th:text="${pagamento.entityCode}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Número de Referência</span>
                    <span class="payment-info-value" th:text="${pagamento.referenceNumber}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Timestamp</span>
                    <span class="payment-info-value" th:text="${pagamento.timestamp}"></span>
                </div>
            </div>

            <div class="mt-4">
                <form action="#" method="post" class="text-center">
                    <input type="hidden" name="fingerprint" th:value="${pagamento.fingerprint}">
                    <button type="submit" class="btn btn-primary btn-lg">Confirmar Pagamento</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
