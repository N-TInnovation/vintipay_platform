<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Gateway de Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .payment-card {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .payment-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .payment-amount {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
        }
        .payment-info {
            margin-top: 2rem;
        }
        .payment-info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        .payment-info-label {
            color: #7f8c8d;
        }
        .payment-info-value {
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="payment-card bg-white">
            <div class="payment-header">
                <h2>Confirmação de Pagamento</h2>
            </div>
            
            <div class="payment-amount">
                <span th:text="${#numbers.formatDecimal(pagamento.intencaoPagamento.amount, 1, 2)}">0.00</span>
                <span th:text="${pagamento.intencaoPagamento.currency}">CVE</span>
            </div>

            <div class="payment-info">
                <div class="payment-info-item">
                    <span class="payment-info-label">Referência</span>
                    <span class="payment-info-value" th:text="${pagamento.intencaoPagamento.merchantRef}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Sessão</span>
                    <span class="payment-info-value" th:text="${pagamento.intencaoPagamento.merchantSession}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Terminal</span>
                    <span class="payment-info-value" th:text="${pagamento.intencaoPagamento.posId}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Código da Transação</span>
                    <span class="payment-info-value" th:text="${pagamento.intencaoPagamento.transactionCode}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Código da Entidade</span>
                    <span class="payment-info-value" th:text="${pagamento.intencaoPagamento.entityCode}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Número de Referência</span>
                    <span class="payment-info-value" th:text="${pagamento.intencaoPagamento.referenceNumber}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Timestamp</span>
                    <span class="payment-info-value" th:text="${pagamento.timestamp}"></span>
                </div>
                <div class="payment-info-item">
                    <span class="payment-info-label">Status</span>
                    <span class="payment-info-value" th:text="${pagamento.status}"></span>
                </div>
            </div>

            <div class="mt-4">
                <form th:action="@{${request.submitFormUrl}}" th:object="${request}" method="post">
                    <input type="hidden"
                           th:value="*{timeStamp}"
                           name="timeStamp">
                    <input type="hidden"
                           th:value="*{fingerprint}"
                           name="fingerprint">
                    <input type="hidden"
                           th:value="*{fingerprintversion}"
                           name="fingerprintversion">
                    <input type="hidden"
                           th:value="*{amount}"
                           name="amount">
                    <input type="hidden"
                           th:value="*{transactionCode}"
                           name="transactionCode">
                    <input type="hidden"
                           th:value="*{posID}"
                           name="posID">
                    <input type="hidden"
                           th:value="*{merchantRef}"
                           name="merchantRef">
                    <input type="hidden"
                           th:value="*{merchantSession}"
                           name="merchantSession">
                    <input type="hidden"
                           th:value="*{currency}"
                           name="currency">
                    <input type="hidden"
                           th:value="*{is3DSec}"
                           name="is3DSec">
                    <input type="hidden"
                           th:value="*{urlMerchantResponse}"
                           name="urlMerchantResponse">
                    <input type="hidden"
                           th:value="*{languageMessages}"
                           name="languageMessages">

                    <!-- opcionais -->
                    <input th:if="*{entityCode}" type="hidden"
                           th:value="*{entityCode}"
                           name="entityCode">

                    <input th:if="*{referenceNumber}" type="hidden"
                           th:value="*{referenceNumber}"
                           name="referenceNumber">

                    <input th:if="*{purchaseRequest}" type="hidden"
                           th:value="*{purchaseRequest}"
                           name="purchaseRequest">

                    <input th:if="*{email}" type="hidden"
                           th:value="*{email}"
                           name="email">

                    <input th:if="*{billAddrCity}" type="hidden"
                           th:value="*{billAddrCity}"
                           name="billAddrCity">

                    <input th:if="*{billAddrCountry}" type="hidden"
                           th:value="*{billAddrCountry}"
                           name="billAddrCountry">

                    <input th:if="*{billAddrLine1}" type="hidden"
                           th:value="*{billAddrLine1}"
                           name="billAddrLine1">

                    <input th:if="*{billAddrPostCode}" type="hidden"
                           th:value="*{billAddrPostCode}"
                           name="billAddrPostCode">

                    <button type="submit" class="btn btn-primary btn-lg w-100">Confirmar Pagamento</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
