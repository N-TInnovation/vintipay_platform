<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Incluir fragmento de favicon reutilizável -->
    <th:block th:replace="~{fragments/head-favicons :: favicons}"></th:block>

    <title>Pagamento Confirmado - VintiPay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --primary-dark: #2980b9;
            --secondary-color: #2ecc71;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --background-light: #f8f9fa;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
        }
        
        body {
            background-color: var(--background-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .success-container {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 15px;
            flex: 1;
        }
        
        .logo-area {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .logo-area img {
            max-height: 60px;
        }
        
        .success-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
            padding: 3rem;
            text-align: center;
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background-color: var(--secondary-color);
            color: white;
            font-size: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }
        
        .success-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--secondary-color);
        }
        
        .success-message {
            color: var(--text-light);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .order-details {
            background-color: var(--background-light);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }
        
        .order-details h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--text-dark);
        }
        
        .order-item {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .order-item-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 1rem;
        }
        
        .order-item-details {
            flex: 1;
        }
        
        .order-item-price {
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .back-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 0.8rem 2rem;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .back-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            color: white;
        }
        
        .footer {
            background-color: white;
            padding: 1rem 0;
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="logo-area">
            <img th:src="@{/img/logo.png}" alt="VintiPay Logo" onerror="this.src='https://via.placeholder.com/180x60?text=VintiPay'">
        </div>
        
        <div class="success-card">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            
            <h1 class="success-title">Pagamento Confirmado!</h1>
            
            <p class="success-message">
                Seu pagamento foi processado com sucesso. Obrigado pela sua compra!
            </p>
            
            <div class="order-details" th:if="${produto != null}">
                <h3>Detalhes da Compra</h3>
                
                <div class="order-item">
                    <img th:if="${produto.imagem != null}" th:src="${produto.imagem}" class="order-item-image" th:alt="${produto.nome}">
                    <img th:unless="${produto.imagem != null}" src="https://via.placeholder.com/60?text=Produto" class="order-item-image" alt="Produto">
                    
                    <div class="order-item-details">
                        <div class="fw-bold" th:text="${produto.nome}">Nome do Produto</div>
                        <div class="small text-muted" th:text="${#strings.abbreviate(produto.descricao, 100)}">Descrição do produto...</div>
                    </div>
                    
                    <div class="order-item-price" th:text="'ECV ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">ECV 99,90</div>
                </div>
                
                <div class="d-flex justify-content-between mt-3 pt-3 border-top">
                    <div class="fw-bold">Total</div>
                    <div class="fw-bold" th:text="'ECV ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">ECV 99,90</div>
                </div>
            </div>
            
            <a href="/" class="back-btn">
                <i class="fas fa-home me-2"></i> Voltar para a Página Inicial
            </a>
        </div>
    </div>
    
    <footer class="footer">
        <div class="container">
            <p> 2025 VintiPay - Plataforma de Pagamentos de Cabo Verde</p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
