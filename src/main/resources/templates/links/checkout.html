<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${produto != null ? produto.nome : 'Checkout'} + ' - VintiPay'">Checkout - VintiPay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --primary-dark: #2980b9;
            --secondary-color: #2ecc71;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --background-light: #f8f9fa;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
        }
        
        body {
            background-color: var(--background-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .checkout-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 15px;
            flex: 1;
        }
        
        .logo-area {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .logo-area img {
            max-height: 60px;
        }
        
        .checkout-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .product-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        
        .product-details {
            padding: 2rem;
        }
        
        .product-price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .product-description {
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        
        .checkout-btn {
            background-color: var(--secondary-color);
            color: white;
            padding: 0.8rem 2rem;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .checkout-btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .seller-info {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .seller-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }
        
        .footer {
            background-color: white;
            padding: 1rem 0;
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-top: auto;
        }
        
        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        .secure-badge i {
            color: var(--secondary-color);
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="logo-area">
            <img th:src="@{/img/logo.png}" alt="VintiPay Logo" onerror="this.src='https://via.placeholder.com/180x60?text=VintiPay'">
        </div>
        
        <div class="alert alert-danger" th:if="${erro != null}">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${erro}">Erro</span>
        </div>
        
        <div class="checkout-card" th:if="${produto != null && link != null}">
            <div th:if="${produto.imagem != null}">
                <img th:src="${produto.imagem}" class="product-image" th:alt="${produto.nome}">
            </div>
            
            <div class="product-details">
                <div class="seller-info">
                    <div class="seller-avatar" th:text="${link.proprietario != null ? link.proprietario.nome.substring(0, 1).toUpperCase() : 'V'}">V</div>
                    <div th:text="${link.proprietario != null ? link.proprietario.nome : 'Vendedor'}">Vendedor</div>
                </div>
                
                <h1 th:text="${link.titulo != null && !link.titulo.isEmpty() ? link.titulo : produto.nome}">Nome do Produto</h1>
                
                <div class="product-price mb-3" th:text="${#numbers.formatCurrency(produto.preco)}">R$ 99,90</div>
                
                <div class="product-description" th:text="${link.descricao != null && !link.descricao.isEmpty() ? link.descricao : produto.descricao}">
                    Descrição do produto...
                </div>
                
                <form th:action="@{/links-pagamento/p/{codigo}/pagar(codigo=${codigo})}" method="post">
                    <button type="submit" class="checkout-btn">
                        <i class="fas fa-lock me-2"></i> Pagar Agora
                    </button>
                </form>
                
                <div class="secure-badge">
                    <i class="fas fa-shield-alt"></i> Pagamento seguro processado pelo SISP
                </div>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <div class="container">
            <p>© 2025 VintiPay - Plataforma de Pagamentos de Cabo Verde</p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
