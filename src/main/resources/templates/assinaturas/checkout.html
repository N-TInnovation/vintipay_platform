<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - VintiPay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Finalizar Assinatura</h3>
                    </div>
                    <div class="card-body">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <h4>Detalhes do Plano</h4>
                                <p><strong>Plano:</strong> <span th:text="${plano.nome}"></span></p>
                                <p><strong>Preço:</strong> R$ <span th:text="${#numbers.formatDecimal(plano.preco, 0, 'POINT', 2, 'COMMA')}"></span>
                                    <span th:text="${'/' + plano.periodoCobranca.toString().toLowerCase()}"></span></p>
                                <p><strong>Descrição:</strong> <span th:text="${plano.descricao}"></span></p>
                                <p th:if="${plano.diasTrial > 0}" class="text-success">
                                    <strong>Período de teste:</strong> <span th:text="${plano.diasTrial + ' dias grátis'}"></span>
                                </p>
                            </div>
                            <div class="col-md-6">
                                <h4>Resumo</h4>
                                <table class="table">
                                    <tr>
                                        <td>Plano</td>
                                        <td th:text="${plano.nome}"></td>
                                    </tr>
                                    <tr>
                                        <td>Período</td>
                                        <td th:text="${plano.periodoCobranca.toString().toLowerCase()}"></td>
                                    </tr>
                                    <tr>
                                        <td><strong>Total</strong></td>
                                        <td><strong>R$ <span th:text="${#numbers.formatDecimal(plano.preco, 0, 'POINT', 2, 'COMMA')}"></span></strong></td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                        
                        <div class="alert alert-info">
                            <p><i class="bi bi-info-circle"></i> Ao clicar em "Continuar para Pagamento", você será redirecionado para o Stripe, nosso processador de pagamentos seguro.</p>
                        </div>
                        
                        <form th:action="@{'/assinaturas/assinar/' + ${plano.id}}" method="post">
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Continuar para Pagamento</button>
                                <a th:href="@{/assinaturas}" class="btn btn-outline-secondary">Voltar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
