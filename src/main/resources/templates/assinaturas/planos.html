<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planos de Assinatura - VintiPay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="text-center">Escolha seu Plano</h1>
                <p class="text-center lead">Selecione o plano que melhor atende às suas necessidades</p>
            </div>
        </div>
        
        <div th:if="${param.erro}" class="alert alert-danger" role="alert" th:text="${param.erro}"></div>
        <div th:if="${param.sucesso}" class="alert alert-success" role="alert" th:text="${param.sucesso}"></div>
        
        <div th:if="${assinaturaAtual}" class="alert alert-info mb-4">
            <h4>Sua Assinatura Atual</h4>
            <p>Plano: <strong th:text="${assinaturaAtual.plano.nome}"></strong></p>
            <p>Status: <span th:text="${assinaturaAtual.status}"></span></p>
            <p th:if="${assinaturaAtual.dataFim}">Válido até: <span th:text="${#temporals.format(assinaturaAtual.dataFim, 'dd/MM/yyyy')}"></span></p>
            
            <form th:action="@{/assinaturas/cancelar}" method="post" class="mt-3">
                <button type="submit" class="btn btn-danger" onclick="return confirm('Tem certeza que deseja cancelar sua assinatura?')">
                    Cancelar Assinatura
                </button>
            </form>
        </div>
        
        <div class="row">
            <div th:each="plano : ${planos}" class="col-md-4 mb-4">
                <div class="card h-100 shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="my-0" th:text="${plano.nome}"></h3>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h2 class="card-title pricing-card-title text-center">
                            R$ <span th:text="${#numbers.formatDecimal(plano.preco, 0, 'POINT', 2, 'COMMA')}"></span>
                            <small class="text-muted" th:text="${'/' + plano.periodoCobranca.toString().toLowerCase()}"></small>
                        </h2>
                        <div class="mt-3 mb-4">
                            <p th:text="${plano.descricao}"></p>
                            <p th:if="${plano.diasTrial > 0}" class="text-success">
                                <strong th:text="${plano.diasTrial + ' dias de teste grátis'}"></strong>
                            </p>
                        </div>
                        <div class="mt-auto">
                            <div class="d-grid gap-2">
                                <a th:href="@{'/assinaturas/checkout/' + ${plano.id}}" class="btn btn-lg btn-outline-primary">Escolher</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
