<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Gateway de Pagamento</title>
    
    <!-- Incluir fragmento de favicon reutilizável -->
    <th:block th:replace="~{fragments/head-favicons :: favicons}"></th:block>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .payment-card {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .payment-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .payment-form {
            display: none;
        }
        .loading-container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-radius: 50%;
            border-top: 5px solid #3498db;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #666;
            font-size: 1.2rem;
            margin-top: 1rem;
        }
        .payment-amount {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
        }
        .payment-info {
            margin-top: 2rem;
        }
        .payment-info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        .payment-info-label {
            color: #7f8c8d;
        }
        .payment-info-value {
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-light" onload="document.getElementById('paymentForm').submit();">
<div class="container">
    <div class="payment-card bg-white">
        <div class="loading-container">
            <div class="spinner"></div>
            <div class="loading-text">
                Processando seu pagamento...
                <br>
                <small>Por favor, aguarde...</small>
            </div>
        </div>
        <div class="payment-form">
            <div class="mt-4">
                <form id="paymentForm" th:action="@{${retornoUrl}}" th:object="${request}" method="post">
                    <!-- Todos os campos do SispWebhookRequest como inputs hidden -->
                    <input type="hidden" th:value="*{merchantRespMerchantRef}" name="merchantRespMerchantRef">
                    <input type="hidden" th:value="*{merchantRespMerchantSession}" name="merchantRespMerchantSession">
                    <input type="hidden" th:value="*{merchantRespErrorCode}" name="merchantRespErrorCode">
                    <input type="hidden" th:value="*{merchantRespErrorDescription}" name="merchantRespErrorDescription">
                    <input type="hidden" th:value="*{merchantRespErrorDetail}" name="merchantRespErrorDetail">
                    <input type="hidden" th:value="*{merchantRespAdditionalErrorMessage}" name="merchantRespAdditionalErrorMessage">
                    <input type="hidden" th:value="*{merchantRespCP}" name="merchantRespCP">
                    <input type="hidden" th:value="*{merchantRespTid}" name="merchantRespTid">
                    <input type="hidden" th:value="*{merchantRespPan}" name="merchantRespPan">
                    <input type="hidden" th:value="*{merchantRespPurchaseAmount}" name="merchantRespPurchaseAmount">
                    <input type="hidden" th:value="*{merchantRespMessageID}" name="merchantRespMessageID">
                    <input type="hidden" th:value="*{merchantResp}" name="merchantResp">
                    <input type="hidden" th:value="*{languageMessages}" name="languageMessages">
                    <input type="hidden" th:value="*{messageType != null ? messageType.code : ''}" name="messageType">
                    <input type="hidden" th:value="*{merchantRespTimeStamp}" name="merchantRespTimeStamp">
                    <input type="hidden" th:value="*{merchantRespReloadCode}" name="merchantRespReloadCode">
                    <input type="hidden" th:value="*{merchantRespClientReceipt}" name="merchantRespClientReceipt">
                    <input type="hidden" th:value="*{merchantRespScreenError}" name="merchantRespScreenError">
                    <input type="hidden" th:value="*{merchantRespEntityCode}" name="merchantRespEntityCode">
                    <input type="hidden" th:value="*{merchantRespReferenceNumber}" name="merchantRespReferenceNumber">
                    <input type="hidden" th:value="*{resultFingerPrint}" name="resultFingerPrint">
                    <input type="hidden" th:value="*{resultFingerPrintVersion}" name="resultFingerPrintVersion">
                    <input type="hidden" th:value="*{userCancelled}" name="userCancelled">

                    <button type="submit" class="btn btn-primary btn-lg w-100">Confirmar Pagamento</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
