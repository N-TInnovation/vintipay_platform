<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title th:text="${produtoId != null ? 'Editar Produto' : 'Novo Produto'} + ' - VintiPay'">Produto - VintiPay</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0" th:text="${produtoId != null ? 'Editar Produto' : 'Novo Produto'}">Produto</h5>
                        </div>
                        
                        <div class="card-body">
                            <form th:action="${produtoId != null ? '/produtos/' + produtoId + '/editar' : '/produtos/novo'}" 
                                  th:object="${produto}" method="post" class="needs-validation" novalidate>
                                
                                <div class="mb-3">
                                    <label for="nome" class="form-label">Nome do Produto *</label>
                                    <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">
                                        Nome do produto é obrigatório
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="descricao" class="form-label">Descrição</label>
                                    <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="3"></textarea>
                                </div>
                                
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="preco" class="form-label">Preço *</label>
                                        <div class="input-group">
                                            <span class="input-group-text">CVE</span>
                                            <input type="number" class="form-control" id="preco" th:field="*{preco}" step="0.01" min="0.01" required>
                                        </div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}">
                                            Preço deve ser maior que zero
                                        </div>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label for="estoque" class="form-label">Estoque</label>
                                        <input type="number" class="form-control" id="estoque" th:field="*{estoque}" min="0">
                                        <small class="text-muted">Deixe em branco para produtos digitais ou serviços</small>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="imagem" class="form-label">URL da Imagem</label>
                                    <input type="url" class="form-control" id="imagem" th:field="*{imagem}" placeholder="https://...">
                                    <small class="text-muted">URL de uma imagem para exibir no produto</small>
                                </div>
                                
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="categoria" class="form-label">Categoria</label>
                                        <input type="text" class="form-control" id="categoria" th:field="*{categoria}">
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label for="codigoSku" class="form-label">Código SKU</label>
                                        <input type="text" class="form-control" id="codigoSku" th:field="*{codigoSku}">
                                        <small class="text-muted">Código único do produto (opcional)</small>
                                    </div>
                                </div>
                                
                                <div class="mb-4" th:if="${produtoId != null}">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}">
                                        <label class="form-check-label" for="ativo">Produto ativo</label>
                                    </div>
                                    <small class="text-muted">Produtos inativos não podem ser vendidos</small>
                                </div>
                                
                                <div class="d-flex justify-content-between">
                                    <a th:href="@{/produtos}" class="btn btn-outline-secondary">
                                        <i class="fas fa-arrow-left me-2"></i> Voltar
                                    </a>
                                    
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i> Salvar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
