<!DOCTYPE html>
<html lang="en">
<head>
  <title>Pagamento Unitel</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Incluir fragmento de favicon reutilizável -->
  <th:block th:replace="fragments/head-favicons :: favicons"></th:block>
  
  <!-- Web App Manifest -->
  <link rel="manifest" th:href="@{/manifest.json}">
  
  <!-- Configurações de tema para navegadores móveis -->
  <meta name="msapplication-TileColor" content="#3498db">
  <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
  <meta name="theme-color" content="#3498db">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body onload="autoPost()">

<h1 class="animate__animated animate__infinite animate__pulse" style="text-align: center;position: relative;margin-top: 25%;">Processando o pagamento...</h1>
<form th:action="@{/doValidate}" th:object="${request}" method="post">
  <input type="hidden"
         th:field="*{session_code}"
         required class="form-control"
         id="session_code"
         aria-describedby="session_codeHelp">
</form>

<script>
  function autoPost(){document.forms[0].submit();}
</script>
</body>
</html>
