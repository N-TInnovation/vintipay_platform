spring:
  datasource:
    url: ${PAYMENT_DB_URI}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    clean-on-validation-error: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true

server:
  port: ${SERVER_PORT}
  ssl:
    enabled: true
    key-store: ${SERVER_SSL_KEY_STORE}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE}
    key-store-password: ${SERVER_SSL_KEY_PASSWORD}
    key-password:  ${SERVER_SSL_KEY_PASSWORD}
    key-alias: ${SERVER_SSL_KEY_ALIAS}
  servlet:
    context-path: /

# Tell Spring Security (if used) to require requests over HTTPS
security:
  require-ssl: true

jwt:
  public:
    key: ${JWT_PUBLIC_KEY}
  private:
    key: ${JWT_PRIVATE_KEY}

# Configurações da API SISP
sisp:
  url:
    prod:
      3d: ${SISP_URL_3D}
      normal: ${SISP_URL_NORMAL}
    dev:
      3d: ${SISP_DEV_URL_3D}
      normal: ${SISP_DEV_URL_NORMAL}
    qld:
      3d: ${SISP_QLD_URL_3D}
      normal: ${SISP_QLD_URL_NORMAL}
  checkout:
    return:
      url: ${SISP_CHECKOUT_RETURN_URL}

# Configurações da API Brevo
brevo:
  api:
    key: ${BREVO_API_KEY}
    url: ${BREVO_API_URL}
  email:
    from: ${BREVO_EMAIL_FROM}

# Configurações da API Stripe'
stripe:
  api:
    key: ${STRIPE_API_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

# Configurações da API Vendus
vendus:
  api:
    key: ${VENDUS_API_KEY}
    base-url: ${VENDUS_API_URL}
