<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80" viewBox="0 0 200 80">
  <style>
    .main-text { 
      font-family: Arial, sans-serif; 
      font-weight: 700;
      font-size: 32px;
    }
    .vinti {
      fill: #3b91d3;
    }
    .pay {
      fill: #333333;
    }
    .tagline {
      font-family: Arial, sans-serif;
      font-size: 12px;
      fill: #666666;
    }
  </style>

  <!-- Fundo transparente -->
  <rect width="100%" height="100%" fill="none"/>
  
  <!-- Logo VintiPay -->
  <g transform="translate(20, 45)">
    <text class="main-text">
      <tspan class="vinti">Vinti</tspan><tspan class="pay">Pay</tspan>
    </text>
    <text class="tagline" x="2" y="18">Pagamentos Digitais</text>
  </g>
</svg>
