spring:
  datasource:
    url: ${PAYMENT_DB_URI}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.SQLServer2016Dialect
      ddl-auto: none

server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore1.jks
    key-store-password: ${SERVER_SSL_KEY_PASSWORD}
    key-password:  ${SERVER_SSL_KEY_PASSWORD}
  servlet:
    context-path: /

# Tell Spring Security (if used) to require requests over HTTPS
security:
  require-ssl: true

jwt:
  public:
    key: "classpath:app.pub"
  private:
    key: "classpath:app.key"

# Configurações da API SISP
sisp:
  url:
    prod:
      3d: ${SISP_URL_3D}
      normal: ${SISP_URL_NORMAL}
    dev:
      3d: ${SISP_DEV_URL_3D}
      normal: ${SISP_DEV_URL_NORMAL}
    qld:
      3d: ${SISP_QLD_URL_3D}
      normal: ${SISP_QLD_URL_NORMAL}
  checkout:
    return:
      url: ${SISP_CHECKOUT_RETURN_URL}

# Configurações da API Brevo
brevo:
  api:
    key: ${BREVO_API_KEY}
    url: ${BREVO_API_URL}
  email:
    from: ${BREVO_EMAIL_FROM}

# Configurações da API Stripe'
stripe:
  api:
    key: ${STRIPE_API_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

# Configurações da API Vendus
vendus:
  api:
    key: ${VENDUS_API_KEY}
    base-url: ${VENDUS_API_URL}
