server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore/gateway.p12
    key-store-type: PKCS12
    key-store-password: 123456
    key-password: 123456
    key-alias: gateway
  servlet:
    context-path: /

# Tell Spring Security (if used) to require requests over HTTPS
security:
  require-ssl: true
jwt:
  public:
    key: "classpath:app.pub"
  private:
    key: "classpath:app.key"

sisp:
  url:
    3d: https://mc.vinti4net.cv/3ds_middleware_php/public/3ds_init.php
    normal: https://mc.vinti4net.cv/BizMPIOnUsSisp/CardPayment
  checkout:
    return:
      url: https://localhost:8443/webhook/sisp/pagamentos/retorno

springdoc:
  api-docs:
    path: /api-docs

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/vintipay?createDatabaseIfNotExist=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: never