  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}

springdoc:
  api-docs:
    path: /api-docs

spring:
  datasource:
    url: ${PAYMENT_DB_URI:jdbc:mysql://localhost:3306/vintipay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PAYMENT_DB_USERNAME:root}
    password: ${PAYMENT_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true
    validate-on-migrate: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:vintipay-webhook-group}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_RESOURCE:vintipay-client}
            client-secret: ${KEYCLOAK_CREDENTIALS_SECRET:PSvxsR3bvLIsRiayytQVJ3oi45snoS52}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:vintipay}
            authorization-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:vintipay}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:vintipay}/protocol/openid-connect/token
            user-info-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:vintipay}/protocol/openid-connect/userinfo
            jwk-set-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:vintipay}/protocol/openid-connect/certs
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:vintipay}
          jwk-set-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:vintipay}/protocol/openid-connect/certs

# Configuração de logging
logging:
  level:
    root: INFO
    cv.ntinnovation.vintipay: DEBUG
    #org.hibernate.SQL: DEBUG
    #org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: ./logs/vintipay.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

# Configurações da API Vendus
vendus:
  api:
    key: 1bcf15d3da754d5322ace80382703722
    base-url: https://www.vendus.cv/ws/v1.2

# Configurações do Keycloak
keycloak:
  enabled: true
  realm: ${KEYCLOAK_REALM:vintipay}
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:18080}
  ssl-required: external
  resource: ${KEYCLOAK_RESOURCE:vintipay-client}
  credentials:
    secret: ${KEYCLOAK_CREDENTIALS_SECRET:vintipay-client-secret}
  use-resource-role-mappings: true
  bearer-only: false
  public-client: false
  confidential-port: 0
  principal-attribute: preferred_username