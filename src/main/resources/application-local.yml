server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore/gateway.p12
    key-store-type: PKCS12
    key-store-password: 123456
    key-password: 123456
    key-alias: gateway
  servlet:
    context-path: /

# Tell Spring Security (if used) to require requests over HTTPS
security:
  require-ssl: true
jwt:
  public:
    key: "classpath:app.pub"
  private:
    key: "classpath:app.key"

sisp:
  url:
    3d: https://mc.vinti4net.cv/3ds_middleware_php/public/3ds_init.php
    normal: https://mc.vinti4net.cv/BizMPIOnUsSisp/CardPayment

uniteltmais:
  entityCode: 1234
  ucc:
    esb:
      api:
        baseurl: http://172.18.5.17:8280
logging:
  level:
    cv:
      uniteltemais:
        gateway_payment: DEBUG

springdoc:
  api-docs:
    path: /api-docs

spring:
  datasource:
    url: jdbc:h2:file:./data/gateway_pagamento;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect