server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore/gateway.p12
    key-store-type: PKCS12
    key-store-password: 123456
    key-password: 123456
    key-alias: gateway
  servlet:
    context-path: /

# Tell Spring Security (if used) to require requests over HTTPS
security:
  require-ssl: true
jwt:
  public:
    key: "classpath:app.pub"
  private:
    key: "classpath:app.key"

sisp:
  url:
    3d: https://mc.vinti4net.cv/3ds_middleware_php/public/3ds_init.php
    normal: https://mc.vinti4net.cv/BizMPIOnUsSisp/CardPayment
  checkout:
    return:
      url: ${APP_BASE_URL:https://localhost:8443}/webhook/sisp/pagamentos/retorno

stripe:
  api:
    key: ${STRIPE_API_KEY:sk_test_51JZHlXFLqETPcYGM3OkBuL08Yv8BFyYLkMIuIRBORak5t2aIOQ5IoRtZOoa0kNMcFbGhjSbHgRG8Hf5WIrPqAh1300GGaBDBpk}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}

springdoc:
  api-docs:
    path: /api-docs

sdatasource:
  url: jdbc:mysql://localhost:3306/vintipay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  username: root
  password:
  driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false
        web-admin-password: admin

# Configuração de logging
logging:
  level:
    root: INFO
    cv.ntinnovation.vintipay: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: ./logs/vintipay.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

  sql:
    init:
      mode: never