version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vintipay-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vintipay
      MYSQL_USER: vintipay
      MYSQL_PASSWORD: vintipay
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - vintipay-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vintipay-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - vintipay-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vintipay-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - vintipay-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  vintipay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vintipay-app
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8443:8443"
    environment:
      - spring.profiles.active=local
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/vintipay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SERVER_PORT=8443
      - SERVER_SSL_ENABLED=false
      - JWT_PUBLIC_KEY=classpath:app.pub
      - JWT_PRIVATE_KEY=classpath:app.key
      - BREVO_API_KEY=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
      - BREVO_API_URL=https://api.brevo.com/v3
      - BREVO_EMAIL_FROM=no-reply@vintipay.cv
      # Keycloak Configuration
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=vintipay
      - KEYCLOAK_RESOURCE=vintipay-client
      - KEYCLOAK_CREDENTIALS_SECRET=vintipay-client-secret
      - STRIPE_API_KEY=sk_test_51JZHlXFLqETPcYGM3OkBuL08Yv8BFyYLkMIuIRBORak5t2aIOQ5IoRtZOoa0kNMcFbGhjSbHgRG8Hf5WIrPqAh1300GGaBDBpk
      - STRIPE_WEBHOOK_SECRET=whsec_your_webhook_secret
      - APP_BASE_URL=https://localhost:8443
      # SISP URLs
      - SISP_URL_3D=https://mc.vinti4net.cv/3ds_middleware_php/public/3ds_init.php
      - SISP_URL_NORMAL=https://mc.vinti4net.cv/BizMPIOnUsSisp/CardPayment
      - SISP_DEV_URL_3D=https://localhost:8443/simulador/sisp/3ds_middleware_php/public/3ds_init.php
      - SISP_DEV_URL_NORMAL=https://localhost:3001/simulador/sisp/3ds_middleware_php/public/3ds_init.php
      - SISP_QLD_URL_3D=https://mc.vinti4net.cv/3ds_middleware_php/public/3ds_init.php
      - SISP_QLD_URL_NORMAL=https://mc.vinti4net.cv/BizMPIOnUsSisp/CardPayment
      - SISP_CHECKOUT_RETURN_URL=https://localhost:8443/api/v1/pagamentos/confirmacao
      # Vendus API
      - VENDUS_API_URL=api.vendus.pt/1.1
      - VENDUS_API_KEY=your-vendus-api-key
      # Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=vintipay-webhook-group
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
    volumes:
      - ./logs:/app/logs
    networks:
      - vintipay-network

volumes:
  mysql-data:

networks:
  vintipay-network:
    driver: bridge
