version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vintipay-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vintipay
      MYSQL_USER: vintipay
      MYSQL_PASSWORD: vintipay
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - vintipay-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vintipay-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - vintipay-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vintipay-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - vintipay-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.1
    container_name: vintipay-keycloak
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 18080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "18080:8080"
    networks:
      - vintipay-network
    healthcheck:
      test: ["CMD-SHELL", "(echo -n > /dev/tcp/127.0.0.1/8080) 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  vintipay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vintipay-app
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "18443:8443"
    env_file:
      - .env.docker
    environment:
      - spring.profiles.active=local
      - VINTIPAY_AUTO_IMPORT_ENABLED=${VINTIPAY_AUTO_IMPORT_ENABLED:-true}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/vintipay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SERVER_PORT=${SERVER_PORT:-8443}
      - SERVER_SSL_ENABLED=${SERVER_SSL_ENABLED:-false}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-classpath:app.pub}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-classpath:app.key}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_API_URL=${BREVO_API_URL:-https://api.brevo.com/v3}
      - BREVO_EMAIL_FROM=${BREVO_EMAIL_FROM:-no-reply@vintipay.cv}
      # Keycloak Configuration
      - KEYCLOAK_AUTH_SERVER_URL=${KEYCLOAK_AUTH_SERVER_URL:-http://vintipay-keycloak:8080}
      - KEYCLOAK_FRONTEND_URL=${KEYCLOAK_FRONTEND_URL:-http://localhost:18080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-vintipay}
      - KEYCLOAK_RESOURCE=${KEYCLOAK_RESOURCE:-vintipay-client}
      - KEYCLOAK_CREDENTIALS_SECRET=${KEYCLOAK_CREDENTIALS_SECRET}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:18443}
      # SISP URLs
      - SISP_URL_3D=${SISP_URL_3D:-https://mc.vinti4net.cv/3ds_middleware_php/public/3ds_init.php}
      - SISP_URL_NORMAL=${SISP_URL_NORMAL:-https://mc.vinti4net.cv/BizMPIOnUsSisp/CardPayment}
      - SISP_DEV_URL_3D=${SISP_DEV_URL_3D:-https://localhost:18443/simulador/sisp/3ds_middleware_php/public/3ds_init.php}
      - SISP_DEV_URL_NORMAL=${SISP_DEV_URL_NORMAL:-https://localhost:3001/simulador/sisp/3ds_middleware_php/public/3ds_init.php}
      - SISP_QLD_URL_3D=${SISP_QLD_URL_3D:-https://mc.vinti4net.cv/3ds_middleware_php/public/3ds_init.php}
      - SISP_QLD_URL_NORMAL=${SISP_QLD_URL_NORMAL:-https://mc.vinti4net.cv/BizMPIOnUsSisp/CardPayment}
      - SISP_CHECKOUT_RETURN_URL=${SISP_CHECKOUT_RETURN_URL:-http://localhost:18443/webhook/sisp/pagamentos/retorno}
      # Vendus API
      - VENDUS_API_URL=${VENDUS_API_URL:-api.vendus.pt/1.1}
      - VENDUS_API_KEY=${VENDUS_API_KEY}
      # Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - SPRING_KAFKA_CONSUMER_GROUP_ID=${SPRING_KAFKA_CONSUMER_GROUP_ID:-vintipay-webhook-group}
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:-earliest}
    volumes:
      - ./logs:/app/logs
    networks:
      - vintipay-network

volumes:
  mysql-data:

networks:
  vintipay-network:
    driver: bridge
